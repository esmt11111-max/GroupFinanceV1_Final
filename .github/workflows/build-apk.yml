name: Build GroupFinance V8 Fixed Signing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify exact V8 source ZIP
        shell: bash
        run: |
          set -e
          test -f "GroupFinanceV8_FIXED_SIGNING_READY.zip"
          echo "V8 source ZIP found successfully."

      - name: Extract exact V8 source
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          mkdir -p "$PROJECT_DIR"

          unzip -o "GroupFinanceV8_FIXED_SIGNING_READY.zip" -d "$PROJECT_DIR"

          echo "Extracted V8 source:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -100

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "V8 source extraction completed successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare fixed signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted"

          mkdir -p "$PROJECT_DIR/app"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/app/fixed-v8-release.jks"

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 "$PROJECT_DIR/app/fixed-v8-release.jks"
          chmod 600 "$PROJECT_DIR/signing.properties"

          echo "Signing key prepared successfully."

      - name: Check signing files
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted"

          test -f "$PROJECT_DIR/app/fixed-v8-release.jks"
          test -f "$PROJECT_DIR/signing.properties"

          echo "Signing files found successfully."

      - name: Build V8 Release APK
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/extracted"

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify Release APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/extracted/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "Release APK signature verified successfully."

      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: extracted/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
