name: Build GroupFinance V8 Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V8 ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "GroupFinanceV8_UPDATE_BACK*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V8 ZIP not found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V8 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-Update
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
