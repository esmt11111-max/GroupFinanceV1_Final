name: Build GroupFinance V8 - 4 Features FINAL UPDATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_UPDATE_4_FEATURES_FINAL_FIXED.zip
  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C
  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 15
  VERSION_NAME: 8.0.2

jobs:
  build:
    name: Build GroupFinance V8 Update - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$SOURCE_ZIP_NAME" \
              -not -path "*/.git/*" \
              | head -1
          )"

          test -n "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$SOURCE_ZIP"

          echo "ZIP integrity: OK"
          sha256sum "$SOURCE_ZIP"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/GroupFinance_SOURCE"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT"

          INDEX_FILE="$(
            find "$EXTRACT" \
              -type f \
              -path "*/app/src/main/assets/index.html" \
              | head -1
          )"

          if [ -z "$INDEX_FILE" ]; then
            echo "::error::index.html was not found."
            exit 1
          fi

          PROJECT_ROOT="${INDEX_FILE%/app/src/main/assets/index.html}"

          test -f "$PROJECT_ROOT/settings.gradle" \
            || test -f "$PROJECT_ROOT/settings.gradle.kts"

          test -d "$PROJECT_ROOT/app"
          test -f "$PROJECT_ROOT/app/src/main/assets/index.html"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

      - name: Verify V8 seed and source
        shell: bash
        run: |
          set -euo pipefail

          P="$PROJECT_ROOT"
          H="$P/app/src/main/assets/index.html"
          S="$P/app/src/main/assets/v8_seed_manifest.json"

          test -f "$H"
          test -f "$S"
          test -f "$P/app/src/main/java/com/groupfinance/app/MainActivity.java"
          test -f "$P/app/src/main/AndroidManifest.xml"

          MEMBERS="$(
            node -e \
              "const x=require(process.argv[1]); console.log(Array.isArray(x.members)?x.members.length:0)" \
              "$S"
          )"

          MEETINGS="$(
            node -e \
              "const x=require(process.argv[1]); console.log(Array.isArray(x.meetings)?x.meetings.length:0)" \
              "$S"
          )"

          echo "Members: $MEMBERS"
          echo "Meetings: $MEETINGS"

          test "$MEMBERS" = "30"
          test "$MEETINGS" = "5"

          grep -Fq '2024-10-08' "$S"
          grep -Fq '2024-11-08' "$S"
          grep -Fq '2024-12-08' "$S"
          grep -Fq '2025-01-08' "$S"
          grep -Fq '2025-02-08' "$S"

          echo "V8 seed: VERIFIED"

      - name: Verify meeting source images
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find "$PROJECT_ROOT/app/src/main/assets" \
              -type f \
              -name 'meeting_source_*.jpg' \
              | wc -l
          )"

          echo "Meeting images: $COUNT"

          test "$COUNT" -ge 10

          echo "Meeting source images: VERIFIED"

      - name: Verify existing data system
        shell: bash
        run: |
          set -euo pipefail

          H="$PROJECT_ROOT/app/src/main/assets/index.html"

          grep -Fq "group_fin_groups_v5" "$H"
          grep -Fq "v8-data-seed-2026-09-16" "$H"
          grep -Fq "function save()" "$H"

          echo "Existing V8 data system: VERIFIED"

      - name: Verify no destructive reset
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          if grep -RInE \
            "localStorage[.]clear[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::localStorage.clear() detected."
            exit 1
          fi

          if grep -RInE \
            "indexedDB[.]deleteDatabase[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::IndexedDB deletion detected."
            exit 1
          fi

          echo "No destructive data reset detected."

      - name: Verify four requested features
        shell: bash
        run: |
          set -euo pipefail

          H="$PROJECT_ROOT/app/src/main/assets/index.html"
          J="$PROJECT_ROOT/app/src/main/java/com/groupfinance/app/MainActivity.java"

          # Feature 1: financing remaining balance
          grep -Fq 'إجمالي المتبقي من التمويلات' "$H"

          # Feature 2 and 3:
          # Emergency and operating fund calculations.
          # Use the actual calculation fields/functions rather than
          # requiring one exact Arabic UI sentence.
          grep -Fq 'function renderFunds()' "$H"
          grep -Fq 'r.emergency' "$H"
          grep -Fq 'r.operation' "$H"
          grep -Fq 'db.meetings.reduce' "$H"

          # Main/report calculations
          grep -Fq 'function renderDashboard()' "$H"
          grep -Fq 'function renderReports()' "$H"

          # Feature 4: reports / printing / sharing
          grep -Fq 'printMemberReport' "$H"
          grep -Fq 'shareMemberReport' "$H"
          grep -Fq 'printFinancialReport' "$H"
          grep -Fq 'shareFinancialReport' "$H"
          grep -Fq 'Android.printPage' "$H"
          grep -Fq 'Android.sharePdf' "$H"

          # Android PDF support
          grep -Fq 'androidx.core.content.FileProvider' "$J"
          grep -Fq 'public void printPage' "$J"
          grep -Fq 'public void sharePdf' "$J"
          grep -Fq 'createAndSharePdf' "$J"

          test -f "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Four requested features: VERIFIED"

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          HTML="$PROJECT_ROOT/app/src/main/assets/index.html"

          node -e '
          const fs = require("fs");

          const file = process.argv[1];
          const html = fs.readFileSync(file, "utf8");

          const scripts = [
            ...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)
          ]
          .map(x => x[1].trim())
          .filter(x => x.length);

          if (!scripts.length) {
            throw new Error("No JavaScript blocks were found.");
          }

          scripts.forEach((code, index) => {
            try {
              new Function(code);
            } catch (error) {
              throw new Error(
                "JavaScript syntax error in block " +
                (index + 1) +
                ": " +
                error.message
              );
            }
          });

          console.log(
            "JavaScript syntax OK: " +
            scripts.length +
            " block(s)"
          );
          ' "$HTML"

          echo "JavaScript: VERIFIED"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare fixed V8 signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/groupfinance-v8.keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias groupfinance-v8 \
            >/dev/null

          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Fixed V8 key: VERIFIED"

      - name: Verify V8 signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ACTUAL="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias groupfinance-v8 \
              | awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          ACTUAL="$(
            echo "$ACTUAL" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          EXPECTED="$(
            echo "$EXPECTED_CERT_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "V8 signing certificate: VERIFIED"

      - name: Create signing properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cat > "$PROJECT_ROOT/signing.properties" <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=groupfinance-v8
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 "$PROJECT_ROOT/signing.properties"

          echo "Signing properties: CREATED"

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | head -1
          )"

          test -n "$APK"

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt2 \
              | sort -V \
              | tail -1
          )"

          test -x "$AAPT2"

          BADGING="$("$AAPT2" dump badging "$RELEASE_APK")"

          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" \
            | grep -Fq "package: name='$APPLICATION_ID'"

          printf '%s\n' "$BADGING" \
            | grep -Fq "versionCode='$VERSION_CODE'"

          printf '%s\n' "$BADGING" \
            | grep -Fq "versionName='$VERSION_NAME'"

          echo "APK package/version: VERIFIED"

      - name: Verify final APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -1
          )"

          test -x "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$RELEASE_APK"

          ACTUAL="$(
            keytool \
              -printcert \
              -jarfile "$RELEASE_APK" \
              | awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          ACTUAL="$(
            echo "$ACTUAL" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          EXPECTED="$(
            echo "$EXPECTED_CERT_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          echo "Expected V8 certificate:"
          echo "$EXPECTED"

          echo "Final APK certificate:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "FINAL APK SIGNATURE: VERIFIED"

      - name: Prepare final artifact
        shell: bash
        run: |
          set -euo pipefail

          FINAL="$RUNNER_TEMP/final"

          rm -rf "$FINAL"
          mkdir -p "$FINAL"

          cp "$RELEASE_APK" \
            "$FINAL/GroupFinance_V8_FINAL_UPDATE.apk"

          sha256sum \
            "$FINAL/GroupFinance_V8_FINAL_UPDATE.apk" \
            > "$FINAL/GroupFinance_V8_FINAL_UPDATE.sha256"

          ls -lh "$FINAL"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-FINAL-UPDATE
          path: ${{ runner.temp }}/final/
          if-no-files-found: error
          retention-days: 30
