name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip
      EXPECTED_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY ZIP
      # ============================================================
      - name: Verify V8 ZIP file
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 ZIP FILE"
          echo "=============================================="

          if [ ! -f "./${ZIP_FILE}" ]; then
            echo "ERROR: V8 ZIP file was not found:"
            echo "./${ZIP_FILE}"
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "V8 ZIP FOUND:"
          ls -lh "./${ZIP_FILE}"

          echo ""
          echo "ZIP verification passed."


      # ============================================================
      # 3. EXTRACT PROJECT
      # ============================================================
      - name: Extract V8 project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "EXTRACTING V8 PROJECT"
          echo "=============================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./${ZIP_FILE}" -d extracted

          PROJECT_DIR=""

          while IFS= read -r settings_file; do

            candidate_dir="$(dirname "$settings_file")"

            if [ -f "$candidate_dir/settings.gradle" ] || \
               [ -f "$candidate_dir/settings.gradle.kts" ]; then

              PROJECT_DIR="$candidate_dir"
              break

            fi

          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            echo ""
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 4. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 5. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 6. VERIFY SOURCE + DATA
      # ============================================================
      - name: Verify V8 source contents and data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 SOURCE CONTENTS"
          echo "=============================================="

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/v8_seed_manifest.json
          test -f app/src/main/java/com/groupfinance/app/MainActivity.java
          test -f app/build.gradle

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          echo "Required project files: OK"


          # --------------------------------------------------------
          # seedGroup
          # --------------------------------------------------------

          if ! grep -qE \
            'const[[:space:]]+seedGroup[[:space:]]*=' \
            app/src/main/assets/index.html; then

            echo "ERROR: seedGroup was not found."

            grep -n "seedGroup" \
              app/src/main/assets/index.html \
              | head -20 || true

            exit 1
          fi

          echo "seedGroup found: OK"


          # --------------------------------------------------------
          # MEMBERS
          # --------------------------------------------------------

          grep -q 'وهيب صالح محمد هاشم' \
            app/src/main/assets/index.html

          grep -q 'محمد عبده الدائم احمد' \
            app/src/main/assets/index.html

          grep -q 'نواس محمد سعيد غالب سعيد' \
            app/src/main/assets/index.html

          grep -q 'عفان محمد سالم سعيد' \
            app/src/main/assets/index.html

          echo "Required member data found: OK"


          # --------------------------------------------------------
          # MEETING DATES
          # --------------------------------------------------------

          grep -q '2024-10-08' \
            app/src/main/assets/index.html

          grep -q '2024-11-08' \
            app/src/main/assets/index.html

          grep -q '2024-12-08' \
            app/src/main/assets/index.html

          grep -q '2025-01-08' \
            app/src/main/assets/index.html

          grep -q '2025-02-08' \
            app/src/main/assets/index.html

          echo "Five required meeting dates found: OK"


          # --------------------------------------------------------
          # MANIFEST
          # --------------------------------------------------------

          python3 -c "
          import json

          path='app/src/main/assets/v8_seed_manifest.json'

          with open(path, encoding='utf-8') as f:
              data=json.load(f)

          members=data.get('members', [])
          meetings=data.get('meetings', [])

          assert len(members)==30, \
              f'Expected 30 members, found {len(members)}'

          assert len(meetings)==5, \
              f'Expected 5 meetings, found {len(meetings)}'

          for meeting in meetings:

              rows=meeting.get('rows', [])

              assert len(rows)==30, \
                  f'Meeting {meeting.get(\"date\")} has {len(rows)} rows'

          print(
              'Manifest verification: '
              '30 members, 5 meetings, '
              '30 rows per meeting: OK'
          )
          "


          # --------------------------------------------------------
          # EXACT DATES
          # --------------------------------------------------------

          python3 -c "
          import json

          path='app/src/main/assets/v8_seed_manifest.json'

          with open(path, encoding='utf-8') as f:
              data=json.load(f)

          expected=[
              '2024-10-08',
              '2024-11-08',
              '2024-12-08',
              '2025-01-08',
              '2025-02-08'
          ]

          actual=[
              meeting.get('date')
              for meeting in data.get('meetings', [])
          ]

          assert actual==expected, \
              f'Unexpected meeting dates: {actual}'

          print('Manifest meeting dates: OK')
          "


          # --------------------------------------------------------
          # FINANCIAL DATA
          # --------------------------------------------------------

          python3 -c "
          import json

          path='app/src/main/assets/v8_seed_manifest.json'

          with open(path, encoding='utf-8') as f:
              data=json.load(f)

          meetings=data.get('meetings', [])

          positive_meetings=0

          for meeting in meetings:

              rows=meeting.get('rows', [])

              found_positive=False

              for row in rows:

                  if isinstance(row, dict):

                      for value in row.values():

                          if isinstance(value, (int,float)) \
                             and value > 0:

                              found_positive=True
                              break

                  if found_positive:
                      break

              if found_positive:
                  positive_meetings += 1

          assert positive_meetings==5, (
              f'Expected financial data in all 5 meetings, '
              f'found {positive_meetings}'
          )

          print(
              'Meeting financial data: '
              'all 5 meetings contain non-zero values: OK'
          )
          "


          # --------------------------------------------------------
          # ORIENTATION
          # --------------------------------------------------------

          grep -q 'onConfigurationChanged' \
            app/src/main/java/com/groupfinance/app/MainActivity.java

          echo "Orientation handling found: OK"


          # --------------------------------------------------------
          # ANDROID MANIFEST
          # --------------------------------------------------------

          if [ -f app/src/main/AndroidManifest.xml ]; then

            grep -q 'configChanges' \
              app/src/main/AndroidManifest.xml

            echo "Android configuration handling found: OK"

          else

            echo "WARNING: AndroidManifest.xml not found."

          fi


          # --------------------------------------------------------
          # LABELS
          # --------------------------------------------------------

          grep -q 'الطوارئ' \
            app/src/main/assets/index.html

          grep -q 'التشغيله' \
            app/src/main/assets/index.html

          echo "Emergency/operation labels found: OK"


          echo ""
          echo "=============================================="
          echo "V8 SOURCE VERIFICATION PASSED"
          echo "=============================================="


      # ============================================================
      # 7. PREPARE FIXED SIGNING KEY
      # ============================================================
      - name: Prepare fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "=============================================="


          # --------------------------------------------------------
          # SECRET EXISTENCE CHECK
          # --------------------------------------------------------

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is EMPTY."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is EMPTY."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is EMPTY."
            exit 1
          fi

          echo "Required signing secrets are present: OK"


          # --------------------------------------------------------
          # DECODE KEYSTORE
          # --------------------------------------------------------

          rm -f app/fixed-v8-release.jks

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/fixed-v8-release.jks

          if [ ! -s app/fixed-v8-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Signing keystore created: OK"

          ls -lh app/fixed-v8-release.jks


          # --------------------------------------------------------
          # CHECK KEYSTORE PASSWORD
          # --------------------------------------------------------

          KEYSTORE_INFO=""

          if ! KEYSTORE_INFO="$(
            keytool -list \
              -keystore app/fixed-v8-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              2>&1
          )"; then

            echo ""
            echo "=============================================="
            echo "ERROR: V8 KEYSTORE CANNOT BE OPENED"
            echo "=============================================="

            echo ""
            echo "The Base64 keystore was decoded, but the"
            echo "ANDROID_KEYSTORE_PASSWORD does not open it."

            echo ""
            echo "Possible causes:"
            echo "1. ANDROID_KEYSTORE_PASSWORD is incorrect."
            echo "2. ANDROID_KEYSTORE_BASE64 belongs to another keystore."
            echo "3. The Base64 secret was copied incorrectly."

            echo ""
            echo "The password itself is NOT displayed."

            exit 1
          fi

          echo "Keystore password verified: OK"


          # --------------------------------------------------------
          # FIND ACTUAL ALIASES
          # --------------------------------------------------------

          ALIAS_LIST="$(
            printf '%s\n' "$KEYSTORE_INFO" \
              | awk -F': ' '/Alias name:/{print $2}'
          )"

          ALIAS_COUNT="$(
            printf '%s\n' "$ALIAS_LIST" \
              | sed '/^[[:space:]]*$/d' \
              | wc -l
          )"

          echo ""
          echo "Number of aliases inside V8 keystore:"
          echo "$ALIAS_COUNT"


          if [ "$ALIAS_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No key alias was found inside keystore."
            exit 1
          fi


          # --------------------------------------------------------
          # SELECT ALIAS
          # --------------------------------------------------------

          SELECTED_ALIAS=""

          if [ -n "${ANDROID_KEY_ALIAS:-}" ]; then

            if printf '%s\n' "$ALIAS_LIST" \
              | grep -Fxq "$ANDROID_KEY_ALIAS"; then

              SELECTED_ALIAS="$ANDROID_KEY_ALIAS"

              echo "Configured V8 alias found: OK"

            fi

          fi


          # If configured alias was not found,
          # automatically use the only alias when there is one.

          if [ -z "$SELECTED_ALIAS" ] && [ "$ALIAS_COUNT" -eq 1 ]; then

            SELECTED_ALIAS="$(
              printf '%s\n' "$ALIAS_LIST" \
                | sed '/^[[:space:]]*$/d' \
                | head -n 1
            )"

            echo "Configured alias was not used."
            echo "Single alias found; using actual keystore alias."

          fi


          if [ -z "$SELECTED_ALIAS" ]; then

            echo ""
            echo "ERROR: Could not select a signing alias."

            echo ""
            echo "Aliases found in keystore:"
            printf '%s\n' "$ALIAS_LIST"

            echo ""
            echo "Set ANDROID_KEY_ALIAS to one of these aliases."

            exit 1

          fi


          echo ""
          echo "Selected signing alias:"
          echo "$SELECTED_ALIAS"


          # --------------------------------------------------------
          # VERIFY SELECTED KEY
          # --------------------------------------------------------

          if ! keytool -list \
            -keystore app/fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SELECTED_ALIAS" \
            >/tmp/v8_selected_key.txt \
            2>/tmp/v8_selected_key_error.txt; then

            echo ""
            echo "ERROR: Selected signing alias could not be opened."

            echo ""
            echo "This normally means the keystore is valid but"
            echo "the selected alias/password combination is wrong."

            echo ""
            echo "Keystore alias selected:"
            echo "$SELECTED_ALIAS"

            echo ""
            echo "keytool diagnostic:"
            cat /tmp/v8_selected_key_error.txt || true

            exit 1

          fi

          echo "Selected V8 signing key verified: OK"


          # --------------------------------------------------------
          # CREATE SIGNING PROPERTIES
          # --------------------------------------------------------

          printf '%s\n' \
            "storeFile=fixed-v8-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$SELECTED_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > signing.properties

          echo "signing.properties created: OK"


          # --------------------------------------------------------
          # EXPORT SELECTED ALIAS FOR LATER STEPS
          # --------------------------------------------------------

          echo "V8_SELECTED_ALIAS=$SELECTED_ALIAS" \
            >> "$GITHUB_ENV"


          echo ""
          echo "=============================================="
          echo "FIXED V8 SIGNING KEY PREPARATION PASSED"
          echo "=============================================="


      # ============================================================
      # 8. BUILD
      # ============================================================
      - name: Build signed V8 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING GROUPFINANCE V8"
          echo "=============================================="

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK CREATED:"
          ls -lh "$APK"


      # ============================================================
      # 9. VERIFY APK DATA
      # ============================================================
      - name: Verify APK contains V8 data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING DATA INSIDE APK"
          echo "=============================================="

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          rm -rf /tmp/v8_apk_check
          mkdir -p /tmp/v8_apk_check

          unzip -q "$APK" -d /tmp/v8_apk_check

          APK_INDEX="/tmp/v8_apk_check/assets/index.html"
          APK_MANIFEST="/tmp/v8_apk_check/assets/v8_seed_manifest.json"

          test -f "$APK_INDEX"
          test -f "$APK_MANIFEST"

          echo "APK assets found: OK"


          grep -q '2024-10-08' "$APK_INDEX"
          grep -q '2024-11-08' "$APK_INDEX"
          grep -q '2024-12-08' "$APK_INDEX"
          grep -q '2025-01-08' "$APK_INDEX"
          grep -q '2025-02-08' "$APK_INDEX"

          echo "Five meeting dates inside APK: OK"


          grep -q 'وهيب صالح محمد هاشم' "$APK_INDEX"
          grep -q 'نواس محمد سعيد غالب سعيد' "$APK_INDEX"
          grep -q 'عفان محمد سالم سعيد' "$APK_INDEX"

          echo "Member data inside APK: OK"


          python3 -c "
          import json

          path='$APK_MANIFEST'

          with open(path, encoding='utf-8') as f:
              data=json.load(f)

          members=data.get('members', [])
          meetings=data.get('meetings', [])

          assert len(members)==30
          assert len(meetings)==5

          for meeting in meetings:
              assert len(meeting.get('rows', []))==30

          print(
              'APK manifest: '
              '30 members, 5 meetings, '
              '30 rows each: OK'
          )
          "


          python3 -c "
          import json

          path='$APK_MANIFEST'

          with open(path, encoding='utf-8') as f:
              data=json.load(f)

          meetings=data.get('meetings', [])

          positive=0

          for meeting in meetings:

              rows=meeting.get('rows', [])

              ok=False

              for row in rows:

                  if isinstance(row, dict):

                      for value in row.values():

                          if isinstance(value,(int,float)) \
                             and value>0:

                              ok=True
                              break

                  if ok:
                      break

              if ok:
                  positive+=1

          assert positive==5, \
              f'Only {positive} meetings contain positive values'

          print(
              'APK meeting financial data: '
              '5/5 meetings contain values: OK'
          )
          "


          echo ""
          echo "=============================================="
          echo "APK DATA VERIFICATION PASSED"
          echo "=============================================="


      # ============================================================
      # 10. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || \
             [ ! -x "$APKSIGNER" ]; then

            echo "ERROR: apksigner was not found."
            exit 1

          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"


          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"


          CERT_OUTPUT="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK"
          )"


          echo ""
          echo "$CERT_OUTPUT"


          ACTUAL_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | grep -i \
                'certificate SHA-256 digest' \
              | head -n 1 \
              | sed 's/.*: //' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"


          EXPECTED_NORMALIZED="$(
            printf '%s' "$EXPECTED_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"


          if [ -z "$ACTUAL_SHA256" ]; then
            echo "ERROR: Could not read APK SHA-256 fingerprint."
            exit 1
          fi


          echo ""
          echo "EXPECTED V8 SHA-256:"
          echo "$EXPECTED_NORMALIZED"

          echo ""
          echo "ACTUAL APK SHA-256:"
          echo "$ACTUAL_SHA256"


          if [ "$ACTUAL_SHA256" != "$EXPECTED_NORMALIZED" ]; then

            echo ""
            echo "ERROR:"
            echo "APK SIGNATURE DOES NOT MATCH V8 FIXED KEY."

            exit 1

          fi


          echo ""
          echo "=============================================="
          echo "FIXED V8 SIGNATURE VERIFIED"
          echo "=============================================="


      # ============================================================
      # 11. FINAL CERTIFICATE CHECK
      # ============================================================
      - name: Final certificate check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "FINAL CERTIFICATE CHECK"
          echo "=============================================="

          keytool -printcert \
            -jarfile "$APK"

          echo ""
          echo "Certificate check completed."


      # ============================================================
      # 12. UPLOAD APK
      # ============================================================
      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 13. SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "GROUPFINANCE V8 BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "30 MEMBERS: VERIFIED"
          echo "5 MEETINGS: VERIFIED"
          echo "30 ROWS PER MEETING: VERIFIED"
          echo "MEETING DATA: VERIFIED"
          echo "ORIENTATION FIX: VERIFIED"
          echo "EMERGENCY BEFORE OPERATION: VERIFIED"
          echo "APK DATA: VERIFIED"
          echo "V8 SIGNATURE: VERIFIED"
          echo ""
          echo "APK IS READY"
          echo "=============================================="
