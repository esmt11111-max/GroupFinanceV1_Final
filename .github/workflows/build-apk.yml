name: Build GroupFinance V8 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-v8-final:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1) Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2) Exact V8 source ZIP check
      # =========================================================
      - name: Verify exact V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "V8 FINAL SOURCE CHECK"
          echo "========================================"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

          SOURCE_ZIP="GroupFinanceV8_FINAL_PROJECT.zip"

          echo ""
          echo "Expected exact V8 source:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo ""
            echo "ERROR: Required V8 source ZIP was not found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort || true
            exit 1
          fi

          echo ""
          echo "Exact V8 source ZIP found: OK"
          ls -lh "$SOURCE_ZIP"

          echo ""
          echo "SHA256 of V8 source ZIP:"
          sha256sum "$SOURCE_ZIP"

          echo ""
          echo "Git tracked status:"
          git ls-files --error-unmatch "$SOURCE_ZIP"

          echo ""
          echo "SOURCE ZIP CHECK: OK"

      # =========================================================
      # 3) Validate and extract V8 source
      # =========================================================
      - name: Validate and extract V8 source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="GroupFinanceV8_FINAL_PROJECT.zip"
          VERIFY_DIR="$RUNNER_TEMP/v8_verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          echo "========================================"
          echo "VALIDATING V8 SOURCE ZIP"
          echo "========================================"

          echo "Testing ZIP integrity..."

          if ! unzip -t "$SOURCE_ZIP"; then
            echo "ERROR: V8 source ZIP is corrupted or invalid."
            exit 1
          fi

          echo "ZIP integrity: OK"

          echo ""
          echo "Extracting V8 source..."

          unzip -q "$SOURCE_ZIP" -d "$VERIFY_DIR"

          echo "Extraction: OK"

          # -----------------------------------------------------
          # Find Android project
          # -----------------------------------------------------

          PROJECT_DIR=""

          if [ -f "$VERIFY_DIR/settings.gradle" ]; then
            PROJECT_DIR="$VERIFY_DIR"
          elif [ -f "$VERIFY_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$VERIFY_DIR"
          else
            FOUND_SETTINGS="$(
              find "$VERIFY_DIR" \
                -type f \
                -name 'settings.gradle' -o -name 'settings.gradle.kts' \
                -print -quit
            )"

            if [ -z "$FOUND_SETTINGS" ]; then
              echo ""
              echo "ERROR: Android Gradle project was not found inside V8 ZIP."
              echo ""
              echo "Top-level extracted contents:"
              find "$VERIFY_DIR" -maxdepth 2 -type f | head -100 || true
              exit 1
            fi

            PROJECT_DIR="$(dirname "$FOUND_SETTINGS")"
          fi

          echo ""
          echo "Detected Android project:"
          echo "$PROJECT_DIR"

          # -----------------------------------------------------
          # Required project files
          # -----------------------------------------------------

          REQUIRED_FILES=(
            "$PROJECT_DIR/settings.gradle"
            "$PROJECT_DIR/app/build.gradle"
            "$PROJECT_DIR/app/src/main/assets/index.html"
            "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo ""
              echo "ERROR: Required file is missing:"
              echo "$FILE"
              exit 1
            fi
          done

          echo ""
          echo "Required Android project files: OK"

          # Save project directory for later steps.
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Also save absolute path.
          echo "$PROJECT_DIR" > "$RUNNER_TEMP/v8_project_dir.txt"

      # =========================================================
      # 4) Verify V8 data
      # =========================================================
      - name: Verify V8 source data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING V8 SOURCE DATA"
          echo "========================================"

          INDEX="app/src/main/assets/index.html"
          MANIFEST="app/src/main/assets/v8_seed_manifest.json"

          # -----------------------------------------------------
          # Basic files
          # -----------------------------------------------------

          test -f "$INDEX"
          test -f "$MANIFEST"

          echo "index.html: OK"
          echo "v8_seed_manifest.json: OK"

          # -----------------------------------------------------
          # Validate JSON
          # -----------------------------------------------------

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/v8_seed_manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Manifest JSON syntax: OK")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Manifest root is not an object.")

          members = data.get("members")
          meetings = data.get("meetings")

          if not isinstance(members, list):
              raise SystemExit("ERROR: members section is missing or invalid.")

          if not isinstance(meetings, list):
              raise SystemExit("ERROR: meetings section is missing or invalid.")

          print("Members:", len(members))
          print("Meetings:", len(meetings))

          if len(members) != 30:
              raise SystemExit(
                  f"ERROR: Expected 30 members, found {len(members)}."
              )

          if len(meetings) != 5:
              raise SystemExit(
                  f"ERROR: Expected 5 meetings, found {len(meetings)}."
              )

          expected_dates = [
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08",
          ]

          actual_dates = [m.get("date") for m in meetings]

          print("Meeting dates:", actual_dates)

          if actual_dates != expected_dates:
              raise SystemExit(
                  "ERROR: Meeting dates do not match expected V8 seed dates."
              )

          for meeting in meetings:
              date = meeting.get("date")
              rows = meeting.get("rows")

              if not isinstance(rows, list):
                  raise SystemExit(
                      f"ERROR: rows section missing for meeting {date}."
                  )

              if len(rows) != 30:
                  raise SystemExit(
                      f"ERROR: Meeting {date} contains "
                      f"{len(rows)} rows instead of 30."
                  )

          print("30 rows per meeting: OK")
          print("Five seed meeting dates: OK")
          print("V8 manifest validation: PASSED")
          PY

          # -----------------------------------------------------
          # Verify embedded seedGroup
          # -----------------------------------------------------

          if ! grep -Fq "const seedGroup={" "$INDEX"; then
            echo "ERROR: Embedded seedGroup was not found in index.html."
            exit 1
          fi

          echo "Embedded seedGroup: OK"

          # -----------------------------------------------------
          # Verify expected important V8 references
          # -----------------------------------------------------

          echo ""
          echo "Checking important V8 functionality references..."

          if grep -Fqi "Backup" "$INDEX"; then
            echo "Backup reference: FOUND"
          else
            echo "WARNING: Backup reference was not detected."
          fi

          if grep -Fqi "Restore" "$INDEX"; then
            echo "Restore reference: FOUND"
          else
            echo "WARNING: Restore reference was not detected."
          fi

          echo ""
          echo "V8 SOURCE VERIFICATION: PASSED"

      # =========================================================
      # 5) Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 6) Gradle
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 7) Prepare fixed V8 signing key
      # =========================================================
      - name: Prepare fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "========================================"

          V8_ALIAS="groupfinance-v8"
          KEYSTORE_FILE="$RUNNER_TEMP/fixed-v8-release.jks"

          # -----------------------------------------------------
          # Check secrets
          # -----------------------------------------------------

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required signing secrets: PRESENT"

          # -----------------------------------------------------
          # Decode keystore
          # -----------------------------------------------------

          rm -f "$KEYSTORE_FILE"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded: OK"

          # -----------------------------------------------------
          # Verify keystore password
          # -----------------------------------------------------

          if ! keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then
            echo "ERROR: Keystore password is incorrect or keystore is invalid."
            exit 1
          fi

          echo "Keystore password: VERIFIED"

          # -----------------------------------------------------
          # Verify fixed alias
          # -----------------------------------------------------

          KEY_INFO="$RUNNER_TEMP/v8_key_info.txt"

          if ! keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$V8_ALIAS" \
            > "$KEY_INFO" 2>&1
          then
            echo "ERROR: Alias '$V8_ALIAS' was not found in the keystore."
            cat "$KEY_INFO"
            exit 1
          fi

          echo "Alias '$V8_ALIAS': FOUND"

          # -----------------------------------------------------
          # Verify PrivateKeyEntry
          # -----------------------------------------------------

          if ! grep -Fq "Entry type: PrivateKeyEntry" "$KEY_INFO"; then
            echo "ERROR: V8 alias is not a PrivateKeyEntry."
            exit 1
          fi

          echo "PrivateKeyEntry: VERIFIED"

          # -----------------------------------------------------
          # Verify exact SHA-256 certificate fingerprint
          # -----------------------------------------------------

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          if ! grep -Fq "$EXPECTED_SHA256" "$KEY_INFO"; then
            echo "ERROR: Signing certificate fingerprint does not match fixed V8 key."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_SHA256"
            echo ""
            echo "Actual certificate
