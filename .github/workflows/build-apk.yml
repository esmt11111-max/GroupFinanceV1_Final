name: Build GroupFinance V8 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-v8-final:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1) Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2) Locate exact V8 ZIP
      # =========================================================
      - name: Verify V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GROUPFINANCE V8 FINAL SOURCE"
          echo "========================================"

          SOURCE_ZIP="$GITHUB_WORKSPACE/.github/workflows/GroupFinanceV8_FINAL_PROJECT.zip"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo ""
          echo "Source ZIP:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo ""
            echo "ERROR: GroupFinanceV8_FINAL_PROJECT.zip was not found."
            echo ""
            echo "ZIP files found in repository:"
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print | sort || true
            exit 1
          fi

          echo ""
          echo "V8 source ZIP found: OK"
          ls -lh "$SOURCE_ZIP"

          echo ""
          echo "SHA256:"
          sha256sum "$SOURCE_ZIP"

      # =========================================================
      # 3) Test ZIP and extract exact V8 project
      # =========================================================
      - name: Extract V8 project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$GITHUB_WORKSPACE/.github/workflows/GroupFinanceV8_FINAL_PROJECT.zip"
          PROJECT_DIR="$RUNNER_TEMP/GroupFinanceV8_FINAL_PROJECT"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          echo "========================================"
          echo "EXTRACTING V8 FINAL PROJECT"
          echo "========================================"

          echo "Testing ZIP integrity..."

          unzip -t "$SOURCE_ZIP"

          echo ""
          echo "ZIP integrity: OK"

          echo ""
          echo "Extracting..."

          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"

          echo "Extraction: OK"

          echo ""
          echo "Checking project root..."

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: root build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "settings.gradle: OK"
          echo "build.gradle: OK"
          echo "app/build.gradle: OK"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 4) Verify exact V8 application source
      # =========================================================
      - name: Verify V8 application source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING V8 APPLICATION"
          echo "========================================"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/assets/v8_seed_manifest.json"
            "app/src/main/java/com/groupfinance/app/MainActivity.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "Required V8 files: OK"

          echo ""
          echo "Checking V8 group name..."

          if ! grep -Fq "أدارة مجموعة التعاون-النسخة الرابعة" \
            app/src/main/assets/index.html
          then
            echo "ERROR: V8 group name was not found."
            exit 1
          fi

          echo "Group name: OK"

          echo ""
          echo "Checking V8 seedGroup..."

          if ! grep -Fq "const seedGroup={" \
            app/src/main/assets/index.html
          then
            echo "ERROR: seedGroup was not found."
            exit 1
          fi

          echo "seedGroup: OK"

          echo ""
          echo "Checking emergency field..."

          if ! grep -Fq "الطوارئ" \
            app/src/main/assets/index.html
          then
            echo "ERROR: Emergency field was not found."
            exit 1
          fi

          echo "Emergency field: OK"

          echo ""
          echo "Checking backup/restore..."

          if ! grep -Fq "النسخ الاحتياطي والاستعادة" \
            app/src/main/assets/index.html
          then
            echo "ERROR: Backup/Restore section was not found."
            exit 1
          fi

          echo "Backup/Restore: OK"

          echo ""
          echo "Checking GFBACK format..."

          if ! grep -Fq "GroupFinance-GFBACK" \
            app/src/main/assets/index.html
          then
            echo "ERROR: GroupFinance-GFBACK format was not found."
            exit 1
          fi

          echo "GFBACK format: OK"

          echo ""
          echo "V8 application source verification: PASSED"

      # =========================================================
      # 5) Verify V8 seed data
      # =========================================================
      - name: Verify V8 seed data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING V8 SEED DATA"
          echo "========================================"

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/v8_seed_manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Manifest root is not an object.")

          members = data.get("members")
          meetings = data.get("meetings")

          if not isinstance(members, list):
              raise SystemExit("ERROR: members is missing or invalid.")

          if not isinstance(meetings, list):
              raise SystemExit("ERROR: meetings is missing or invalid.")

          print("Members:", len(members))
          print("Meetings:", len(meetings))

          if len(members) != 30:
              raise SystemExit(
                  f"ERROR: Expected 30 members, found {len(members)}."
              )

          if len(meetings) != 5:
              raise SystemExit(
                  f"ERROR: Expected 5 meetings, found {len(meetings)}."
              )

          expected_dates = [
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08",
          ]

          actual_dates = [m.get("date") for m in meetings]

          print("Meeting dates:", actual_dates)

          if actual_dates != expected_dates:
              raise SystemExit(
                  "ERROR: Seed meeting dates do not match V8 data."
              )

          for meeting in meetings:
              date = meeting.get("date")
              rows = meeting.get("rows")

              if not isinstance(rows, list):
                  raise SystemExit(
                      f"ERROR: rows missing for meeting {date}."
                  )

              if len(rows) != 30:
                  raise SystemExit(
                      f"ERROR: Meeting {date} has {len(rows)} rows; "
                      "expected 30."
                  )

          print("30 members: OK")
          print("5 meetings: OK")
          print("30 rows per meeting: OK")
          print("V8 seed data verification: PASSED")
          PY

      # =========================================================
      # 6) Verify JavaScript syntax
      # =========================================================
      - name: Verify JavaScript syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING JAVASCRIPT"
          echo "========================================"

          node --version

          node - <<'NODE'
          const fs = require('fs');

          const path = 'app/src/main/assets/index.html';
          const html = fs.readFileSync(path, 'utf8');

          const scripts = [
            ...html.matchAll(
              /<script(?:[^>]*)>([\s\S]*?)<\/script>/gi
            )
          ]
          .map(m => m[1])
          .filter(x => x.trim());

          if (!scripts.length) {
            throw new Error('No JavaScript found in index.html');
          }

          scripts.forEach((code, index) => {
            try {
              new Function(code);
            } catch (error) {
              throw new Error(
                `JavaScript syntax error in script ${index + 1}: ${error.message}`
              );
            }
          });

          console.log(
            `JavaScript syntax: OK (${scripts.length} script block(s))`
          );
          NODE

      # =========================================================
      # 7) Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 8) Gradle 8.9
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 9) Prepare fixed V8 signing key
      # =========================================================
      - name: Prepare fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "========================================"

          V8_ALIAS="groupfinance-v8"
          KEYSTORE_FILE="$RUNNER_TEMP/fixed-v8-release.jks"

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Required signing secrets: PRESENT"

          rm -f "$KEYSTORE_FILE"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded: OK"

          if ! keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then
            echo "ERROR: Keystore password is incorrect or keystore is invalid."
            exit 1
          fi

          echo "Keystore password: VERIFIED"

          KEY_INFO="$RUNNER_TEMP/v8_key_info.txt"

          if ! keytool \
            -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$V8_ALIAS" \
            > "$KEY_INFO" 2>&1
          then
            echo "ERROR: Alias '$V8_ALIAS' was not found."
            cat "$KEY_INFO"
            exit 1
          fi

          echo "Alias '$V8_ALIAS': FOUND"

          if ! grep -Fq "Entry type: PrivateKeyEntry" "$KEY_INFO"; then
            echo "ERROR: Alias is not a PrivateKeyEntry."
            exit 1
          fi

          echo "PrivateKeyEntry: VERIFIED"

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          if ! grep -Fq "$EXPECTED_SHA256" "$KEY_INFO"; then
            echo "ERROR: Signing certificate fingerprint does not match fixed V8 key."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_SHA256"
            echo ""
            echo "Actual certificate information:"
            grep -E "Owner:|Issuer:|SHA256:" "$KEY_INFO" || true
            exit 1
          fi

          echo "Fixed V8 SHA-256 fingerprint: VERIFIED"

          printf '%s\n' \
            "storeFile=$KEYSTORE_FILE" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$V8_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > signing.properties

          echo "signing.properties: CREATED"

          echo "Fixed V8 signing configuration: PASSED"

      # =========================================================
      # 10) Build signed V8 APK
      # =========================================================
      - name: Build signed V8 release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILDING GROUPFINANCE V8 FINAL"
          echo "========================================"

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: V8 release APK was not created."
            echo ""
            echo "APK output directory:"
            find app/build/outputs -type f -maxdepth 5 -print || true
            exit 1
          fi

          echo ""
          echo "V8 APK BUILD: SUCCESS"
          ls -lh "$APK"

      # =========================================================
      # 11) Verify APK package and signature
      # =========================================================
      - name: Verify final APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFYING FINAL V8 APK"
          echo "========================================"

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -print \
              | sort -V \
              | tail -1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK signature verification: OK"

          APK_CERT="$RUNNER_TEMP/v8_apk_certificate.txt"

          keytool \
            -printcert \
            -jarfile "$APK" \
            > "$APK_CERT"

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          echo ""
          echo "Checking final APK certificate..."

          if ! grep -Fq "$EXPECTED_SHA256" "$APK_CERT"; then
            echo "ERROR: Final APK certificate does not match fixed V8 identity."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_SHA256"
            echo ""
            echo "Actual:"
            cat "$APK_CERT"
            exit 1
          fi

          echo "Final APK SHA-256: VERIFIED"

          echo ""
          echo "========================================"
          echo "V8 FINAL APK VERIFICATION: PASSED"
          echo "========================================"

      # =========================================================
      # 12) Rename final APK
      # =========================================================
      - name: Prepare final V8 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          FINAL_APK="app/build/outputs/apk/release/GroupFinance-V8-FINAL-signed.apk"

          cp "$APK" "$FINAL_APK"

          echo "Final APK:"
          ls -lh "$FINAL_APK"

      # =========================================================
      # 13) Upload final APK artifact
      # =========================================================
      - name: Upload GroupFinance V8 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-FINAL-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/GroupFinance-V8-FINAL-signed.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 14) Final success message
      # =========================================================
      - name: V8 FINAL BUILD COMPLETE
        shell: bash
        run: |
          echo "========================================"
          echo "GROUPFINANCE V8 FINAL BUILD COMPLETE"
          echo "========================================"
          echo ""
          echo "Source:"
          echo "GroupFinanceV8_FINAL_PROJECT.zip"
          echo ""
          echo "APK:"
          echo "GroupFinance-V8-FINAL-signed.apk"
          echo ""
          echo "Signing identity:"
          echo "Fixed V8 signing key"
          echo ""
          echo "SHA-256:"
          echo "14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"
          echo ""
          echo "BUILD STATUS: SUCCESS"
          echo "========================================"
