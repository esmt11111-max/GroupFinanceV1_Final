name: Build GroupFinance V8 Fixed Signing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact V8 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="GroupFinanceV8_FIXED_SIGNING_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Exact V8 source ZIP not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Files in repository root:"
            ls -lah
            exit 1
          fi

          echo "Using exact V8 source:"
          echo "$ZIP_FILE"

      - name: Extract exact V8 source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "GroupFinanceV8_FIXED_SIGNING_READY.zip" -d extracted

          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare fixed signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/fixed-v8-release.jks"

          cat > "$PROJECT_DIR/signing.properties" <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 "$PROJECT_DIR/fixed-v8-release.jks"
          chmod 600 "$PROJECT_DIR/signing.properties"

          echo "Fixed signing key prepared."

      - name: Build V8 Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Release APK
        shell: bash
        run: |
          set -e

          APK="${PROJECT_DIR}/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "Release APK created successfully:"
          ls -lh "$APK"

          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f | head -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Verifying APK signature..."

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
