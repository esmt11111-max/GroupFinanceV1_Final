name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. VERIFY ZIP
      # =========================================================
      - name: Verify V8 ZIP file
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo "=========================================="
          echo "VERIFYING V8 ZIP FILE"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required V8 ZIP file was not found:"
            echo "$ZIP_FILE"
            echo
            echo "ZIP files currently in repository:"
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi

          echo "V8 ZIP found:"
          ls -lh "$ZIP_FILE"

          echo
          echo "ZIP contents:"
          unzip -l "$ZIP_FILE" | head -100


      # =========================================================
      # 3. EXTRACT PROJECT
      #    IMPORTANT:
      #    No unsafe find command is used here.
      # =========================================================
      - name: Extract V8 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo "=========================================="
          echo "EXTRACTING V8 PROJECT"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          ls -la extracted

          PROJECT_DIR=""

          # -------------------------------------------------------
          # Case 1: Android project is directly inside ZIP
          # -------------------------------------------------------
          if [ -f "extracted/settings.gradle" ]; then
            PROJECT_DIR="extracted"
          elif [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted"
          fi

          # -------------------------------------------------------
          # Case 2: Android project is inside one subdirectory
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            for DIR in extracted/*; do
              if [ -d "$DIR" ]; then
                if [ -f "$DIR/settings.gradle" ]; then
                  PROJECT_DIR="$DIR"
                  break
                fi

                if [ -f "$DIR/settings.gradle.kts" ]; then
                  PROJECT_DIR="$DIR"
                  break
                fi
              fi
            done
          fi

          # -------------------------------------------------------
          # Final validation
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            echo
            echo "Extracted project files:"
            ls -la extracted
            ls -la extracted/app 2>/dev/null || true
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app directory was not found:"
            echo "$PROJECT_DIR/app"
            exit 1
          fi

          echo
          echo "Android project found successfully:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 4. VERIFY REQUIRED SOURCE FILES
      # =========================================================
      - name: Verify V8 source contents and data
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING V8 SOURCE CONTENTS"
          echo "=========================================="

          echo "Project directory:"
          echo "$PROJECT_DIR"

          REQUIRED_FILES=(
            "$PROJECT_DIR/settings.gradle"
            "$PROJECT_DIR/build.gradle"
            "$PROJECT_DIR/app/build.gradle"
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
            "$PROJECT_DIR/app/src/main/assets/index.html"
            "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required file missing:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "Required project files: OK"

          # -------------------------------------------------------
          # seedGroup
          # -------------------------------------------------------
          if grep -Fq "const seedGroup={" \
            "$PROJECT_DIR/app/src/main/assets/index.html"; then
            echo "seedGroup found: OK"
          elif grep -Fq "const seedGroup =" \
            "$PROJECT_DIR/app/src/main/assets/index.html"; then
            echo "seedGroup found: OK"
          else
            echo "ERROR: seedGroup was not found."
            exit 1
          fi

          # -------------------------------------------------------
          # Member data
          # -------------------------------------------------------
          MEMBER_COUNT=$(grep -o '"members"' \
            "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json" \
            | wc -l)

          if [ "$MEMBER_COUNT" -lt 1 ]; then
            echo "ERROR: Members data was not found in manifest."
            exit 1
          fi

          echo "Member data found: OK"

          # -------------------------------------------------------
          # Required meeting dates
          # -------------------------------------------------------
          for DATE in \
            "2024-10-08" \
            "2024-11-08" \
            "2024-12-08" \
            "2025-01-08" \
            "2025-02-08"
          do
            if ! grep -Fq "$DATE" \
              "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json"; then
              echo "ERROR: Required meeting date missing:"
              echo "$DATE"
              exit 1
            fi
          done

          echo "Five required meeting dates found: OK"

          # -------------------------------------------------------
          # Verify JSON is valid
          # -------------------------------------------------------
          python3 -c '
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          members = data.get("members", [])
          meetings = data.get("meetings", [])

          print(f"Manifest members: {len(members)}")
          print(f"Manifest meetings: {len(meetings)}")

          if len(members) != 30:
              print("ERROR: Expected exactly 30 members.")
              sys.exit(1)

          if len(meetings) != 5:
              print("ERROR: Expected exactly 5 meetings.")
              sys.exit(1)

          required_dates = {
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08"
          }

          actual_dates = set()

          for meeting in meetings:
              date = meeting.get("date")
              actual_dates.add(date)

              rows = meeting.get("rows", [])

              print(
                  f"Meeting {date}: "
                  f"{len(rows)} rows"
              )

              if len(rows) != 30:
                  print(
                      f"ERROR: Meeting {date} "
                      f"does not contain 30 rows."
                  )
                  sys.exit(1)

          if actual_dates != required_dates:
              print("ERROR: Meeting dates do not match required V8 dates.")
              print("Actual:", sorted(actual_dates))
              print("Required:", sorted(required_dates))
              sys.exit(1)

          print(
              "Manifest verification: "
              "30 members, 5 meetings, "
              "30 rows per meeting: OK"
          )
          ' "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json"


      # =========================================================
      # 5. VERIFY ORIENTATION FIX
      # =========================================================
      - name: Verify orientation and display order fixes
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/groupfinance/app/MainActivity.java"
          INDEX_HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "=========================================="
          echo "VERIFYING V8 FIXES"
          echo "=========================================="

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          if grep -Fq "onConfigurationChanged" "$MAIN_ACTIVITY"; then
            echo "Orientation handling found: OK"
          else
            echo "ERROR: onConfigurationChanged was not found."
            exit 1
          fi

          if grep -Fq "configChanges" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"; then
            echo "Android configChanges found: OK"
          else
            echo "ERROR: configChanges was not found."
            exit 1
          fi

          if grep -Fq "الطوارئ" "$INDEX_HTML"; then
            echo "Emergency label found: OK"
          else
            echo "ERROR: Emergency label was not found."
            exit 1
          fi

          if grep -Fq "التشغيله" "$INDEX_HTML"; then
            echo "Operation label found: OK"
          else
            echo "ERROR: Operation label was not found."
            exit 1
          fi

          echo "V8 orientation/order checks: OK"


      # =========================================================
      # 6. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 7. GRADLE 8.9
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # =========================================================
      # 8. PREPARE FIXED V8 SIGNING KEY
      # =========================================================
      - name: Prepare fixed V8 signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "=========================================="

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is empty."
            exit 1
          fi

          echo "Required signing secrets are present: OK"

          cd "$PROJECT_DIR"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > fixed-v8-release.jks

          if [ ! -s fixed-v8-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Signing keystore created: OK"
          ls -lh fixed-v8-release.jks

          # -------------------------------------------------------
          # Verify keystore password
          # -------------------------------------------------------
          if ! keytool \
            -list \
            -keystore fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            >/dev/null 2>&1
          then
            echo "ERROR: V8 KEYSTORE CANNOT BE OPENED."
            echo "The keystore password does not open the decoded keystore."
            exit 1
          fi

          echo "Keystore password verified: OK"

          # -------------------------------------------------------
          # IMPORTANT:
          # Use verbose output so "Alias name:" is actually present.
          # -------------------------------------------------------
          KEYSTORE_VERBOSE="$(
            keytool \
              -list \
              -v \
              -keystore fixed-v8-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD"
          )"

          ALIAS_LIST="$(
            printf '%s\n' "$KEYSTORE_VERBOSE" \
              | awk -F': ' '/^Alias name:/{print $2}'
          )"

          if [ -z "$ALIAS_LIST" ]; then
            echo "ERROR: No key alias was found inside V8 keystore."
            exit 1
          fi

          echo "Aliases inside V8 keystore:"
          printf '%s\n' "$ALIAS_LIST"

          if ! printf '%s\n' "$ALIAS_LIST" \
            | grep -Fxq "$ANDROID_KEY_ALIAS"; then
            echo "ERROR: Required V8 alias was not found."
            exit 1
          fi

          echo "V8 alias verified: OK"

          SELECTED_KEY="$(
            keytool \
              -list \
              -v \
              -keystore fixed-v8-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS"
          )"

          if ! printf '%s\n' "$SELECTED_KEY" \
            | grep -Fq "Entry type: PrivateKeyEntry"; then
            echo "ERROR: V8 alias is not a PrivateKeyEntry."
            exit 1
          fi

          echo "PrivateKeyEntry verified: OK"

          # -------------------------------------------------------
          # Create signing.properties
          # -------------------------------------------------------
          cat > signing.properties <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          echo "Signing properties created: OK"


      # =========================================================
      # 9. BUILD RELEASE APK
      # =========================================================
      - name: Build signed V8 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING SIGNED V8 APK"
          echo "=========================================="

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon


      # =========================================================
      # 10. VERIFY APK EXISTS
      # =========================================================
      - name: Verify V8 APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "V8 APK created successfully:"
          ls -lh "$APK"


      # =========================================================
      # 11. VERIFY APK DATA
      # =========================================================
      - name: Verify APK contains V8 data
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "VERIFYING APK CONTENT"
          echo "=========================================="

          if ! unzip -l "$APK" | grep -Fq "assets/index.html"; then
            echo "ERROR: APK does not contain assets/index.html"
            exit 1
          fi

          echo "APK contains index.html: OK"

          if ! unzip -l "$APK" | grep -Fq "assets/v8_seed_manifest.json"; then
            echo "ERROR: APK does not contain v8_seed_manifest.json"
            exit 1
          fi

          echo "APK contains V8 seed manifest: OK"


      # =========================================================
      # 12. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verification: OK"


      # =========================================================
      # 13. VERIFY APK CERTIFICATE FINGERPRINT
      # =========================================================
      - name: Verify V8 signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "VERIFYING V8 SIGNATURE FINGERPRINT"
          echo "=========================================="

          CERT_OUTPUT="$(
            keytool \
              -printcert \
              -jarfile "$APK"
          )"

          ACTUAL_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          echo "Expected V8 SHA-256:"
          echo "$EXPECTED_SHA256"

          echo "Actual APK SHA-256:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK is NOT signed with the fixed V8 signing key."
            exit 1
          fi

          echo "V8 signing certificate verified: OK"


      # =========================================================
      # 14. UPLOAD FINAL APK
      # =========================================================
      - name: Upload V8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
