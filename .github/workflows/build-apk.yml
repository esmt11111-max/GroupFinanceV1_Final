name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Move Files to Root
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            mkdir -p temp_extracted
            unzip -q "$ZIP_FILE" -d temp_extracted
            
            # نقل جميع المحتويات إلى جذر المستودع مباشرة
            shopt -s dotglob
            cp -r temp_extracted/* ./
            shopt -u dotglob
            
            echo "=== Files in root after moving ==="
            ls -la
          else
            echo "No zip file found."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e
          # التحقق من وجود gradlew في الجذر أو تحويله إلى قابل للتنفيذ
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            # البحث عنه في أي مجلد فرعي إن وجد
            PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -type f -exec dirname {} \; | head -n 1)
            if [ -n "$PROJECT_DIR" ]; then
              echo "Found gradlew in: $PROJECT_DIR"
              cd "$PROJECT_DIR"
              chmod +x ./gradlew
              ./gradlew assembleDebug
            else
              echo "Error: gradlew not found!"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
