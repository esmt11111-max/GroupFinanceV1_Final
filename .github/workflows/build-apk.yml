name: Build GroupFinance V8 - 4 Features FINAL UPDATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_UPDATE_4_FEATURES_FINAL_FIXED.zip
  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C
  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 15
  VERSION_NAME: 8.0.2

jobs:
  build:
    name: Build GroupFinance V8 Update - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$SOURCE_ZIP_NAME" \
              -not -path "*/.git/*" \
              | head -1
          )"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP_NAME"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$SOURCE_ZIP"

          echo "ZIP integrity: OK"
          sha256sum "$SOURCE_ZIP"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/GroupFinance_SOURCE"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT"

          echo "Searching for Android project..."

          INDEX_FILE="$(
            find "$EXTRACT" \
              -type f \
              -path "*/app/src/main/assets/index.html" \
              | head -1
          )"

          if [ -z "$INDEX_FILE" ]; then
            echo "::error::app/src/main/assets/index.html was not found."

            echo "Extracted directory tree:"
            find "$EXTRACT" -maxdepth 7 -type f | head -200

            exit 1
          fi

          PROJECT_ROOT="${INDEX_FILE%/app/src/main/assets/index.html}"

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] &&
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file was not found."

            find "$PROJECT_ROOT" -maxdepth 3 -type f | sort | head -200

            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Android app directory was not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project located successfully:"
          echo "$PROJECT_ROOT"

          echo "IMPORTANT: gradlew wrapper is NOT required."

      - name: Verify V8 seed and source
        shell: bash
        run: |
          set -euo pipefail

          P="$PROJECT_ROOT"
          H="$P/app/src/main/assets/index.html"
          S="$P/app/src/main/assets/v8_seed_manifest.json"

          test -f "$H"
          test -f "$S"
          test -f "$P/app/src/main/AndroidManifest.xml"

          MEMBERS="$(
            node -e \
              "const x=require(process.argv[1]); console.log(Array.isArray(x.members)?x.members.length:0)" \
              "$S"
          )"

          MEETINGS="$(
            node -e \
              "const x=require(process.argv[1]); console.log(Array.isArray(x.meetings)?x.meetings.length:0)" \
              "$S"
          )"

          echo "Members: $MEMBERS"
          echo "Meetings: $MEETINGS"

          test "$MEMBERS" = "30"
          test "$MEETINGS" = "5"

          grep -Fq '2024-10-08' "$S"
          grep -Fq '2024-11-08' "$S"
          grep -Fq '2024-12-08' "$S"
          grep
