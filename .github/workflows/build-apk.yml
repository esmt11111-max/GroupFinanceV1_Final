name: Build GroupFinance V8 - 4 Features FINAL UPDATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_UPDATE_4_FEATURES_FINAL_FIXED.zip
  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C
  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 15
  VERSION_NAME: 8.0.2

jobs:
  build:
    name: Build GroupFinance V8 Update - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for $SOURCE_ZIP_NAME ..."

          mapfile -t FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$SOURCE_ZIP_NAME" \
              -not -path "*/.git/*"
          )

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one source ZIP, found ${#FILES[@]}."
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          SOURCE_ZIP="${FILES[0]}"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$SOURCE_ZIP"

          echo "Source ZIP integrity: OK"

          echo "Source ZIP SHA-256:"
          sha256sum "$SOURCE_ZIP"

      - name: Extract and locate real Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/GroupFinance_SOURCE"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT"

          echo "Searching for the REAL Android project root..."

          mapfile -t INDEX_FILES < <(
            find "$EXTRACT" \
              -type f \
              -path "*/app/src/main/assets/index.html" \
              -print
          )

          if [ "${#INDEX_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one app/src/main/assets/index.html."
            echo "Found ${#INDEX_FILES[@]}:"
            printf '%s\n' "${INDEX_FILES[@]}"
            echo ""
            echo "Extracted project tree:"
            find "$EXTRACT" -maxdepth 7 -type f | sort | head -500
            exit 1
          fi

          INDEX_FILE="${INDEX_FILES[0]}"

          PROJECT_ROOT="$(dirname \
            "$(dirname \
              "$(dirname \
                "$(dirname \
                  "$(dirname \
                    "$(dirname "$INDEX_FILE"
                  )"
                )"
              )"
            )"
          )"

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then

            echo "::error::Located index.html but calculated root does not contain settings.gradle."

            echo "Index:"
            echo "$INDEX_FILE"

            echo "Searching upward for settings.gradle..."

            CURRENT="$(dirname "$INDEX_FILE")"

            FOUND_ROOT=""

            while [ "$CURRENT" != "/" ] && \
                  [ "$CURRENT" != "$EXTRACT" ]; do

              if [ -f "$CURRENT/settings.gradle" ] || \
                 [ -f "$CURRENT/settings.gradle.kts" ]; then
                FOUND_ROOT="$CURRENT"
                break
              fi

              CURRENT="$(dirname "$CURRENT")"
            done

            if [ -n "$FOUND_ROOT" ]; then
              PROJECT_ROOT="$FOUND_ROOT"
            else
              echo "::error::Could not find Android Gradle project root."
              exit 1
            fi
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Android app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/src/main/assets/index.html" ]; then
            echo "::error::index.html not found in final project root."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "REAL PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          echo "Android project structure:"
          find "$PROJECT_ROOT/app/src/main" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      - name: Verify V8 source and data
        shell: bash
        run: |
          set -euo pipefail

          P="$PROJECT_ROOT"
          H="$P/app/src/main/assets/index.html"
          S="$P/app/src/main/assets/v8_seed_manifest.json"
          J="$P/app/src/main/java/com/groupfinance/app/MainActivity.java"

          test -f "$H"
          test -f "$J"

          echo "Checking V8 seed manifest..."

          if [ ! -f "$S" ]; then
            echo "::error::v8_seed_manifest.json is missing."
            exit 1
          fi

          MEMBERS="$(node -e "const x=require(process.argv[1]); console.log(Array.isArray(x.members)?x.members.length:0)" "$S")"
          MEETINGS="$(node -e "const x=require(process.argv[1]); console.log(Array.isArray(x.meetings)?x.meetings.length:0)" "$S")"

          echo "Members: $MEMBERS"
          echo "Meetings: $MEETINGS"

          test "$MEMBERS" = "30"
          test "$MEETINGS" = "5"

          grep -Fq '2024-10-08' "$S"
          grep -Fq '2024-11-08' "$S"
          grep -Fq '2024-12-08' "$S"
          grep -Fq '2025-01-08' "$S"
          grep -Fq '2025-02-08' "$S"

          echo "V8 members and meetings: OK"

          echo "Checking existing database..."

          grep -Fq "const GROUP_KEY='group_fin_groups_v5'" "$H"
          grep -Fq "const V8_DATA_SEED='v8-data-seed-2026-09-16'" "$H"
          grep -Fq "localStorage.getItem(V8_DATA_SEED)!=='1'" "$H"
          grep -Fq "function save()" "$H"

          echo "Existing data system: OK"

      - name: Verify no destructive data reset
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          if grep -RInE \
            "local
