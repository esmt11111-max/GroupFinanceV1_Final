name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1) تحميل محتويات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) البحث عن ملف V8 الصحيح فقط وفك الضغط
      - name: Verify and extract exact V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo "=============================================="
          echo "Checking required V8 source ZIP..."
          echo "=============================================="
          echo "Required file:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Required V8 source ZIP was NOT found."
            echo "The workflow will stop and will NOT build another ZIP."
            echo ""
            echo "Files currently in repository root:"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          echo ""
          echo "SUCCESS: Correct V8 ZIP found."

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside the V8 ZIP."
            exit 1
          fi

          echo ""
          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3) التحقق من ملفات V8 الأساسية والبيانات قبل البناء
      - name: Verify V8 source contents and data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 SOURCE"
          echo "=============================================="

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/v8_seed_manifest.json
          test -f app/src/main/java/com/groupfinance/app/MainActivity.java
          test -f app/build.gradle
          test -f settings.gradle

          echo "Required project files: OK"

          python3 <<'PY'
          import json
          import re
          import sys

          index_file = "app/src/main/assets/index.html"

          with open(index_file, "r", encoding="utf-8") as f:
              html = f.read()

          # استخراج seedGroup الحقيقي المضمّن داخل index.html
          match = re.search(
              r"const\s+seedGroup\s*=\s*(\{.*?\})\s*;",
              html,
              re.S
          )

          if not match:
              print("ERROR: seedGroup was not found in index.html")
              sys.exit(1)

          try:
              seed = json.loads(match.group(1))
          except Exception as e:
              print("ERROR: seedGroup JSON is invalid:", e)
              sys.exit(1)

          members = seed.get("members", [])
          meetings = seed.get("meetings", [])

          print("Members:", len(members))
          print("Meetings:", len(meetings))

          if len(members) != 30:
              print("ERROR: Expected exactly 30 members.")
              sys.exit(1)

          if len(meetings) != 5:
              print("ERROR: Expected exactly 5 meetings.")
              sys.exit(1)

          expected_dates = [
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08"
          ]

          actual_dates = [m.get("date") for m in meetings]

          print("Meeting dates:", actual_dates)

          if actual_dates != expected_dates:
              print("ERROR: Meeting dates do not match the required five months.")
              sys.exit(1)

          for meeting in meetings:
              rows = meeting.get("rows", [])

              print(
                  meeting.get("date"),
                  "rows=",
                  len(rows)
              )

              if len(rows) != 30:
                  print(
                      "ERROR: Meeting",
                      meeting.get("date"),
                      "does not contain exactly 30 member rows."
                  )
                  sys.exit(1)

          # التأكد من أن البيانات ليست كلها أصفار
          non_zero = 0

          for meeting in meetings:
              for row in meeting.get("rows", []):
                  for key in [
                      "savings",
                      "operation",
                      "emergency",
                      "installment",
                      "paidInstallment",
                      "totalPaid"
                  ]:
                      value = row.get(key, 0)
                      try:
                          if float(value or 0) != 0:
                              non_zero += 1
                      except Exception:
                          pass

          print("Non-zero financial values:", non_zero)

          if non_zero == 0:
              print("ERROR: Meeting financial data appears to be empty/zero.")
              sys.exit(1)

          # التحقق من وجود إصلاح ترتيب الطوارئ قبل التشغيلية
          if "الطوارئ" not in html:
              print("ERROR: الطوارئ label not found.")
              sys.exit(1)

          if "التشغيله" not in html:
              print("ERROR: التشغيله label not found.")
              sys.exit(1)

          # التحقق من كود الحفاظ على الصفحة عند تغيير الاتجاه
          with open(
              "app/src/main/java/com/groupfinance/app/MainActivity.java",
              "r",
              encoding="utf-8"
          ) as f:
              main_activity = f.read()

          if "onConfigurationChanged" not in main_activity:
              print(
                  "ERROR: Orientation handling "
                  "(onConfigurationChanged) not found."
              )
              sys.exit(1)

          print("")
          print("==============================================")
          print("V8 SOURCE DATA VERIFICATION PASSED")
          print("30 members")
          print("5 meetings")
          print("30 rows per meeting")
          print("Actual non-zero financial data present")
          print("Orientation handling present")
          print("==============================================")
          PY

      # 4) إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5) إعداد Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6) إعداد مفتاح توقيع V8 الثابت
      - name: Configure fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Checking V8 signing secrets..."
          echo "=============================================="

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "Signing secrets found."

          # إنشاء ملف المفتاح داخل مجلد المشروع
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > fixed-v8-release.jks

          test -s fixed-v8-release.jks

          # إنشاء ملف إعدادات التوقيع
          cat > signing.properties <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          echo "Fixed V8 signing key configured successfully."

      # 7) بناء نسخة Release الموقعة
      - name: Build signed V8 release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING GROUPFINANCE V8"
          echo "=============================================="

          gradle :app:assembleRelease --stacktrace --no-daemon

          test -f app/build/outputs/apk/release/app-release.apk

          echo ""
          echo "APK BUILD SUCCESSFUL"

      # 8) فحص توقيع APK والتأكد من مفتاح V8
      - name: Verify APK signature and V8 fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "Certificate information:"

          keytool -printcert -jarfile "$APK"

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          echo ""
          echo "Checking fixed V8 SHA-256 fingerprint..."

          keytool -printcert -jarfile "$APK" \
            | grep -F "$EXPECTED_SHA256"

          echo ""
          echo "=============================================="
          echo "V8 SIGNATURE VERIFIED"
          echo "Fingerprint matches fixed V8 signing key."
          echo "=============================================="

      # 9) رفع APK النهائي إلى Actions
      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 10) إظهار معلومات البناء النهائية
      - name: Build summary
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=============================================="
          echo "GROUPFINANCE V8 BUILD COMPLETED"
          echo "=============================================="
          echo "Source:"
          echo "GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"
          echo ""
          echo "APK:"
          echo "app-release.apk"
          echo ""
          echo "Artifact:"
          echo "GroupFinance-V8-release-signed"
          echo ""
          echo "Signing:"
          echo "Fixed V8 signing key"
          echo ""
          echo "Expected fingerprint:"
          echo "14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"
          echo "=============================================="
