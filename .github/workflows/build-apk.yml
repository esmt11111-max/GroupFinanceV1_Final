name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            unzip -q "$ZIP_FILE" -d unzipped_project
          else
            echo "No zip file found in root."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e
          # بحث شامل وأوتوماتيكي عن مجلد المشروع الذي يحتوي على ملف gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew could not be found anywhere in the repository!"
            find . -maxdepth 4
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
