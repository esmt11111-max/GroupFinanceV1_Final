name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Locate Project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            mkdir -p extracted_files
            unzip -q "$ZIP_FILE" -d extracted_files
          else
            echo "No zip file found."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e
          # البحث عن المجلد الذي يحتوي على gradlew والانتقال إليه تلقائياً
          PROJECT_DIR=$(find . -name "gradlew" -type f -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found gradlew in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found anywhere!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
