name: Build GroupFinance V8 - 4 Features FINAL UPDATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_UPDATE_4_FEATURES_FINAL_FIXED.zip

  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C

  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 15
  VERSION_NAME: 8.0.2

jobs:

  build:
    name: Build GroupFinance V8 Update - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1 - CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2 - FIND SOURCE ZIP
      # =========================================================

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for source ZIP..."

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "$SOURCE_ZIP_NAME" \
            -not -path "*/.git/*" \
            | head -1)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP was not found."
            echo "Expected:"
            echo "$SOURCE_ZIP_NAME"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"


      # =========================================================
      # 3 - TEST ZIP
      # =========================================================

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -tq "$SOURCE_ZIP"

          echo "ZIP integrity: OK"

          echo "ZIP SHA256:"
          sha256sum "$SOURCE_ZIP"


      # =========================================================
      # 4 - EXTRACT AND FIND REAL PROJECT
      # =========================================================

      - name: Extract and locate real Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/GroupFinance_SOURCE"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          echo "Extracting source..."

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT"

          echo "Searching for:"
          echo "app/src/main/assets/index.html"

          INDEX_FILE="$(
            find "$EXTRACT" \
              -type f \
              -path "*/app/src/main/assets/index.html" \
              -print \
              | head -1
          )"

          if [ -z "$INDEX_FILE" ]; then
            echo "::error::index.html was not found inside the source ZIP."

            echo "Files found:"
            find "$EXTRACT" \
              -maxdepth 8 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo "index.html found:"
          echo "$INDEX_FILE"

          PROJECT_ROOT="${INDEX_FILE%/app/src/main/assets/index.html}"

          if [ "$PROJECT_ROOT" = "$INDEX_FILE" ]; then
            echo "::error::Could not determine PROJECT_ROOT."
            exit 1
          fi

          echo "Checking project root:"
          echo "$PROJECT_ROOT"

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then

            echo "::error::settings.gradle was not found."

            echo "Project root contents:"
            find "$PROJECT_ROOT" \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::app directory was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/src/main/assets/index.html" ]; then
            echo "::error::index.html is missing from project root."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "REAL PROJECT ROOT"
          echo "$PROJECT_ROOT"
          echo "======================================"

          echo "Android project located successfully."


      # =========================================================
      # 5 - VERIFY IMPORTANT V8 FILES
      # =========================================================

      - name: Verify V8 source files
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"
          INDEX="$ASSETS/index.html"

          test -f "$INDEX"

          echo "Checking Android MainActivity..."

          if [ ! -f "$PROJECT_ROOT/app/src/main/java/com/groupfinance/app/MainActivity.java" ]; then
            echo "::error::MainActivity.java was not found."
            exit 1
          fi

          echo "Checking existing storage key..."

          if ! grep -RInF \
            "group_fin_groups_v5" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js" \
            >/dev/null; then

            echo "::error::Existing storage key group_fin_groups_v5 was not found."
            exit 1
          fi

          echo "Existing storage key: OK"

          echo "Checking V8 seed marker..."

          if ! grep -RInF \
            "v8-data-seed-2026-09-16" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js" \
            >/dev/null; then

            echo "::error::V8 data seed marker was not found."
            exit 1
          fi

          echo "V8 seed marker: OK"


      # =========================================================
      # 6 - PROTECT EXISTING DATA
      # =========================================================

      - name: Verify no destructive data reset
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          echo "Checking for destructive data reset..."

          if grep -RInE \
            "localStorage[.]clear[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::localStorage.clear() detected."
            echo "This build is stopped to protect existing data."
            exit 1
          fi

          if grep -RInE \
            "indexedDB[.]deleteDatabase[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::IndexedDB deletion detected."
            exit 1
          fi

          if grep -RInE \
            "clearData[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::clearData() detected."
            exit 1
          fi

          echo "No destructive reset command detected."


      # =========================================================
      # 7 - VERIFY FOUR FEATURES
      # =========================================================

      - name: Verify four requested features
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          echo "Checking financing remaining balance..."

          if ! grep -RInF \
            "إجمالي المتبقي من التمويلات" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js" \
            >/dev/null; then

            echo "::error::Financing remaining balance feature was not found."
            exit 1
          fi

          echo "Financing remaining balance: OK"

          echo "Checking emergency fund totals..."

          if ! grep -RInF \
            "إجمالي المصروف منه" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js" \
            >/dev/null; then

            echo "::error::Emergency spending total was not found."
            exit 1
          fi

          echo "Emergency spending total: OK"

          echo "Checking remaining balance..."

          if ! grep -RInF \
            "الرصيد المتبقي" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js" \
            >/dev/null; then

            echo "::error::Remaining balance was not found."
            exit 1
          fi

          echo "Remaining balance: OK"

          echo "Checking dashboard/fund/report functions..."

          for FUNCTION in \
            renderDashboard \
            renderFunds \
            renderReports \
            save \
            exportData \
            importData
          do

            if ! grep -RInE \
              "function[[:space:]]+$FUNCTION[[:space:]]*\(" \
              "$ASSETS" \
              --include="*.html" \
              --include="*.js" \
              >/dev/null; then

              echo "::error::Required function not found: $FUNCTION"
              exit 1
            fi

            echo "Found: $FUNCTION"

          done

          echo "Four requested features: VERIFIED"


      # =========================================================
      # 8 - JAVASCRIPT SYNTAX
      # =========================================================
      #
      # IMPORTANT:
      # لا يوجد هنا heredoc باسم NODE.
      # هذا يمنع خطأ Unexpected end of input السابق.
      # =========================================================

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          HTML="$PROJECT_ROOT/app/src/main/assets/index.html"

          test -f "$HTML"

          echo "Checking JavaScript syntax..."

          node -e '
          const fs = require("fs");

          const file = process.argv[1];
          const html = fs.readFileSync(file, "utf8");

          const matches = [
            ...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)
          ];

          if (matches.length === 0) {
            throw new Error("No JavaScript blocks found.");
          }

          let count = 0;

          for (const match of matches) {
            const code = match[1].trim();

            if (!code) {
              continue;
            }

            count++;

            try {
              new Function(code);
            } catch (error) {
              throw new Error(
                "JavaScript syntax error in block " +
                count +
                ": " +
                error.message
              );
            }
          }

          if (count === 0) {
            throw new Error("No non-empty JavaScript blocks found.");
          }

          console.log(
            "JavaScript syntax OK. Checked " +
            count +
            " block(s)."
          );
          ' "$HTML"

          echo "JavaScript syntax: VERIFIED"


      # =========================================================
      # 9 - JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 10 - GRADLE 8.9
      # =========================================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # =========================================================
      # 11 - LOAD FIXED V8 KEY
      # =========================================================

      - name: Load fixed V8 signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEY_PASSWORD secret is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/groupfinance-v8.keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Keystore could not be decoded."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          chmod 600 "$KEYSTORE"

          echo "V8 signing key loaded."


      # =========================================================
      # 12 - VERIFY FIXED CERTIFICATE
      # =========================================================

      - name: Verify V8 signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking alias groupfinance-v8..."

          KEY_INFO="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias groupfinance-v8
          )"

          printf '%s\n' "$KEY_INFO" \
            | grep -Fq "Alias name: groupfinance-v8"

          ACTUAL="$(
            printf '%s\n' "$KEY_INFO" \
              | grep -i "SHA256:" \
              | head -1 \
              | sed 's/.*SHA256:[[:space:]]*//'
          )"

          ACTUAL="$(
            echo "$ACTUAL" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          EXPECTED="$(
            echo "$EXPECTED_CERT_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          echo "Expected V8 certificate:"
          echo "$EXPECTED"

          echo "Actual certificate:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match V8."
            exit 1
          fi

          echo "V8 signing certificate: VERIFIED"


      # =========================================================
      # 13 - CREATE SIGNING PROPERTIES
      # =========================================================

      - name: Create signing properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cat > "$PROJECT_ROOT/signing.properties" <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=groupfinance-v8
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 "$PROJECT_ROOT/signing.properties"

          echo "Signing properties created."


      # =========================================================
      # 14 - FORCE VERSION AND SIGNING
      # =========================================================

      - name: Configure release version and signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_ROOT/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "::error::app/build.gradle was not found."
            exit 1
          fi

          python3 - "$BUILD_FILE" "$KEYSTORE_FILE" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import sys

          path = sys.argv[1]
          keystore = sys.argv[2]
          store_password = sys.argv[3]
          key_password = sys.argv[4]
          version_code = sys.argv[5]
          version_name = sys.argv[6]

          text = open(path, "r", encoding="utf-8").read()

          block = f'''

          // ===== GroupFinance V8 FINAL UPDATE signing/version =====

          android {{

              defaultConfig {{
                  versionCode {version_code}
                  versionName "{version_name}"
              }}

              signingConfigs {{

                  v8release {{

                      storeFile file("{keystore}")
                      storePassword "{store_password}"
                      keyAlias "groupfinance-v8"
                      keyPassword "{key_password}"

                  }}

              }}

              buildTypes {{

                  release {{

                      signingConfig signingConfigs.v8release

                  }}

              }}

          }}

          // ===== End GroupFinance V8 FINAL UPDATE =====

          '''

          marker = "// ===== GroupFinance V8 FINAL UPDATE signing/version ====="

          if marker in text:
              start = text.index(marker)
              end_marker = "// ===== End GroupFinance V8 FINAL UPDATE ====="

              if end_marker in text[start:]:
                  end = text.index(end_marker, start)
                  end += len(end_marker)
                  text = text[:start] + text[end:]

          text = text.rstrip() + block + "\n"

          open(path, "w", encoding="utf-8").write(text)

          print("Gradle configuration updated.")
          PY

          echo "Version:"
          grep -n "versionCode" "$BUILD_FILE" | tail -3
          grep -n "versionName" "$BUILD_FILE" | tail -3

          echo "Signing:"
          grep -n "groupfinance-v8" "$BUILD_FILE" | tail -5


      # =========================================================
      # 15 - VERIFY GRADLE CONFIG
      # =========================================================

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$PROJECT_ROOT/app/build.gradle"

          grep -Fq "groupfinance-v8" "$BUILD_FILE"
          grep -Fq "v8release" "$BUILD_FILE"
          grep -Fq "versionCode 15" "$BUILD_FILE"
          grep -Fq 'versionName "8.0.2"' "$BUILD_FILE"

          echo "Gradle configuration: VERIFIED"


      # =========================================================
      # 16 - CLEAN
      # =========================================================

      - name: Clean Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean --no-daemon


      # =========================================================
      # 17 - BUILD
      # =========================================================

      - name: Build signed release APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo "Gradle build completed."


      # =========================================================
      # 18 - FIND APK
      # =========================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | grep -i release \
              | head -1
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            find "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              | sort

            exit 1
          fi

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"


      # =========================================================
      # 19 - VERIFY PACKAGE / VERSION
      # =========================================================

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt2 \
              | sort -V \
              | tail -1
          )"

          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 was not found."
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$RELEASE_APK")"

          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" \
            | grep -Fq "package: name='$APPLICATION_ID'"

          printf '%s\n' "$BADGING" \
            | grep -Fq "versionCode='$VERSION_CODE'"

          printf '%s\n' "$BADGING" \
            | grep -Fq "versionName='$VERSION_NAME'"

          echo "APK package: VERIFIED"
          echo "APK version: VERIFIED"


      # =========================================================
      # 20 - VERIFY FINAL APK SIGNATURE
      # =========================================================

      - name: Verify final APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          echo "Running APK signature verification..."

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$RELEASE_APK"

          ACTUAL="$(
            keytool \
              -printcert \
              -jarfile "$RELEASE_APK" \
              | grep -i "SHA256:" \
              | head -1 \
              | sed 's/.*SHA256:[[:space:]]*//'
          )"

          ACTUAL="$(
            echo "$ACTUAL" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          EXPECTED="$(
            echo "$EXPECTED_CERT_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"

          echo "Expected V8 certificate:"
          echo "$EXPECTED"

          echo "Final APK certificate:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::FINAL APK IS NOT SIGNED WITH THE V8 KEY."
            exit 1
          fi

          echo "FINAL APK SIGNATURE: VERIFIED"


      # =========================================================
      # 21 - APK SHA256
      # =========================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$RELEASE_APK"


      # =========================================================
      # 22 - PREPARE FINAL ARTIFACT
      # =========================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          FINAL="$RUNNER_TEMP/GroupFinance-V8-FINAL"

          rm -rf "$FINAL"
          mkdir -p "$FINAL"

          cp "$RELEASE_APK" \
            "$FINAL/GroupFinance_V8_FINAL_UPDATE.apk"

          sha256sum \
            "$FINAL/GroupFinance_V8_FINAL_UPDATE.apk" \
            > "$FINAL/GroupFinance_V8_FINAL_UPDATE.sha256"

          echo "Final APK:"
          ls -lh "$FINAL"

          echo "FINAL_DIR=$FINAL" >> "$GITHUB_ENV"


      # =========================================================
      # 23 - UPLOAD
      # =========================================================

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-FINAL-UPDATE
          path: ${{ runner.temp }}/GroupFinance-V8-FINAL/
          if-no-files-found: error
          retention-days: 30
