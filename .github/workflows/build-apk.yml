name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1) Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2) Verify exact V8 source ZIP
      # ============================================================
      - name: Verify V8 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo "Checking source ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required source ZIP was not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "Source ZIP found: OK"
          echo "ZIP size:"
          stat -c '%s bytes' "$ZIP_FILE"

      # ============================================================
      # 3) Extract source project
      # ============================================================
      - name: Extract V8 project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip" -d extracted

          echo "Source extracted: OK"

      # ============================================================
      # 4) Locate Android project
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "extracted/settings.gradle" ] || [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted"

          elif [ -f "extracted/GroupFinance/settings.gradle" ] || [ -f "extracted/GroupFinance/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted/GroupFinance"

          else
            echo "ERROR: Android project root was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project root:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json" ]; then
            echo "ERROR: v8_seed_manifest.json was not found."
            exit 1
          fi

          echo "Required project files: OK"

      # ============================================================
      # 5) Verify V8 source contents
      # ============================================================
      - name: Verify V8 source contents
        shell: bash
        run: |
          set -e

          INDEX_HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          MANIFEST="$PROJECT_DIR/app/src/main/assets/v8_seed_manifest.json"

          echo "========================================"
          echo "VERIFYING V8 SOURCE CONTENTS"
          echo "========================================"

          # ----------------------------------------------------------
          # seedGroup
          # ----------------------------------------------------------
          if grep -Fq "const seedGroup={" "$INDEX_HTML"; then
            echo "seedGroup found: OK"
          elif grep -Fq "const seedGroup =" "$INDEX_HTML"; then
            echo "seedGroup found: OK"
          else
            echo "ERROR: const seedGroup was not found."
            exit 1
          fi

          # ----------------------------------------------------------
          # Manifest JSON syntax
          # ----------------------------------------------------------
          if jq empty "$MANIFEST" >/dev/null 2>&1; then
            echo "Manifest JSON syntax: OK"
          else
            echo "ERROR: v8_seed_manifest.json is not valid JSON."
            exit 1
          fi

          # ----------------------------------------------------------
          # Exact V8 data verification
          # ----------------------------------------------------------
          if jq -e '
            (.members | length) == 30
            and
            (.meetings | length) == 5
            and
            ([.meetings[].date] | sort) == [
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08"
            ]
            and
            all(.meetings[]; (.rows | length) == 30)
          ' "$MANIFEST" >/dev/null; then

            echo "Manifest verification: 30 members, 5 meetings, 30 rows per meeting: OK"
            echo "Manifest meeting dates: OK"

          else
            echo "ERROR: V8 manifest data does not match expected data."
            exit 1
          fi

      # ============================================================
      # 6) Verify orientation and field order
      # ============================================================
      - name: Verify V8 fixes
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/groupfinance/app/MainActivity.java"
          ANDROID_MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          INDEX_HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "========================================"
          echo "VERIFYING V8 FIXES"
          echo "========================================"

          # Orientation
          if grep -Fq "onConfigurationChanged" "$MAIN_ACTIVITY"; then
            echo "onConfigurationChanged found: OK"
          else
            echo "ERROR: onConfigurationChanged not found."
            exit 1
          fi

          if grep -Fq "android:configChanges" "$ANDROID_MANIFEST"; then
            echo "android:configChanges found: OK"
          else
            echo "ERROR: android:configChanges not found."
            exit 1
          fi

          # Emergency
          if grep -Fq "الطوارئ" "$INDEX_HTML"; then
            echo "Emergency field found: OK"
          else
            echo "ERROR: الطوارئ field not found."
            exit 1
          fi

          # Operating
          if grep -Fq "التشغيله" "$INDEX_HTML"; then
            echo "Operating field found: OK"
          else
            echo "ERROR: التشغيله field not found."
            exit 1
          fi

          echo "V8 fixes verification: OK"

      # ============================================================
      # 7) Setup Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 8) Setup Gradle 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # 9) Prepare fixed V8 signing key
      # ============================================================
      - name: Prepare fixed V8 signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "========================================"

          # ----------------------------------------------------------
          # Check secrets
          # ----------------------------------------------------------
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is empty."
            exit 1
          fi

          echo "Required signing secrets are present: OK"

          # ----------------------------------------------------------
          # Decode keystore
          # ----------------------------------------------------------
          rm -f fixed-v8-release.jks

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > fixed-v8-release.jks

          if [ ! -s fixed-v8-release.jks ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

          echo "Signing keystore created: OK"

          # ----------------------------------------------------------
          # Verify store password
          # ----------------------------------------------------------
          if keytool \
            -list \
            -keystore fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > keystore-basic.txt 2>&1
          then
            echo "Keystore password verified: OK"
          else
            echo "ERROR: Keystore password is incorrect."
            cat keystore-basic.txt
            exit 1
          fi

          # ----------------------------------------------------------
          # IMPORTANT:
          # Directly open the alias from the secret.
          # Do not parse the alias list because GitHub masks secrets.
          # ----------------------------------------------------------
          rm -f selected-key.txt

          if keytool \
            -list \
            -v \
            -keystore fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > selected-key.txt 2>&1
          then
            echo "V8 alias verified: OK"
          else
            echo "ERROR: The configured V8 alias could not be opened."
            cat selected-key.txt
            exit 1
          fi

          # ----------------------------------------------------------
          # Verify key type
          # ----------------------------------------------------------
          if grep -Fq "Entry type: PrivateKeyEntry" selected-key.txt; then
            echo "PrivateKeyEntry verified: OK"
          else
            echo "ERROR: V8 alias is not a PrivateKeyEntry."
            exit 1
          fi

          # ----------------------------------------------------------
          # Verify fixed V8 certificate
          # ----------------------------------------------------------
          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          if grep -Fq "$EXPECTED_SHA256" selected-key.txt; then
            echo "V8 SHA-256 fingerprint verified: OK"
          else
            echo "ERROR: V8 certificate fingerprint does not match."
            exit 1
          fi

          # ----------------------------------------------------------
          # Create signing.properties
          # ----------------------------------------------------------
          cat > "$PROJECT_DIR/signing.properties" <<EOF
storeFile=$GITHUB_WORKSPACE/fixed-v8-release.jks
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
keyPassword=$ANDROID_KEY_PASSWORD
EOF

          echo "Signing properties created: OK"

      # ============================================================
      # 10) Build signed V8 APK
      # ============================================================
      - name: Build signed V8 APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 11) Verify APK exists
      # ============================================================
      - name: Verify V8 APK exists
        shell: bash
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: OK"
          stat -c '%s bytes' "$APK_PATH"

      # ============================================================
      # 12) Verify APK contains V8 data
      # ============================================================
      - name: Verify APK contains V8 data
        shell: bash
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          unzip -l "$APK_PATH" > apk-contents.txt

          if grep -Fq "assets/index.html" apk-contents.txt; then
            echo "APK index.html: OK"
          else
            echo "ERROR: APK does not contain assets/index.html."
            exit 1
          fi

          if grep -Fq "assets/v8_seed_manifest.json" apk-contents.txt; then
            echo "APK V8 manifest: OK"
          else
            echo "ERROR: APK does not contain assets/v8_seed_manifest.json."
            exit 1
          fi

      # ============================================================
      # 13) Verify APK signature
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS_DIR=""

          while IFS= read -r dir; do
            BUILD_TOOLS_DIR="$dir"
          done < <(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V
          )

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "ERROR: Android build-tools directory not found."
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "APK signature verification: OK"

      # ============================================================
      # 14) Verify final V8 certificate
      # ============================================================
      - name: Verify V8 signing certificate
        shell: bash
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS_DIR=""

          while IFS= read -r dir; do
            BUILD_TOOLS_DIR="$dir"
          done < <(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V
          )

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          "$APKSIGNER" verify \
            --print-certs \
            "$APK_PATH" \
            > apk-cert.txt 2>&1

          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          if grep -Fq "$EXPECTED_SHA256" apk-cert.txt; then
            echo "V8 signing certificate SHA-256: VERIFIED"
          else
            echo "ERROR: Final APK certificate does not match fixed V8 key."
            cat apk-cert.txt
            exit 1
          fi

      # ============================================================
      # 15) Upload final APK
      # ============================================================
      - name: Upload V8 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
