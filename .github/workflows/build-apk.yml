name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            unzip -q "$ZIP_FILE" -d unzipped_project
          else
            echo "No zip file found in root."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Auto-Gradlew
        shell: bash
        run: |
          set -e
          # البحث عن مجلد المشروع الداخلي
          if [ -d "unzipped_project" ]; then
            cd unzipped_project
          fi
          
          # إذا لم يكن gradlew موجوداً، سنقوم بتوليده تلقائياً عبر gradle wrapper
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating it automatically..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
