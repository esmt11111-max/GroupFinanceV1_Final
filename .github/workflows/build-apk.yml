name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ZIP_FILE: GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip
      EXPECTED_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C

    steps:

      # =========================================================
      # 1 - Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2 - التأكد من ملف V8 الصحيح
      # =========================================================

      - name: Verify V8 ZIP file
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 ZIP FILE"
          echo "=============================================="

          if [ ! -f "./${ZIP_FILE}" ]; then
            echo "ERROR: V8 ZIP file was not found:"
            echo "./${ZIP_FILE}"
            echo ""
            echo "ZIP files found in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "V8 ZIP FOUND:"
          ls -lh "./${ZIP_FILE}"

          echo ""
          echo "ZIP verification passed."


      # =========================================================
      # 3 - فك ضغط مشروع V8
      # =========================================================

      - name: Extract V8 project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "EXTRACTING V8 PROJECT"
          echo "=============================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "./${ZIP_FILE}" -d extracted

          echo "ZIP extracted successfully."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do

            candidate_dir="$(dirname "$settings_file")"

            if [ -f "$candidate_dir/settings.gradle" ] || \
               [ -f "$candidate_dir/settings.gradle.kts" ]; then

              PROJECT_DIR="$candidate_dir"
              break

            fi

          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo ""
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 4 - Java 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 5 - Gradle
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================================================
      # 6 - فحص مشروع V8 والبيانات
      #
      # مهم:
      # لا نفترض أن manifest يحتوي:
      # "members": 30
      #
      # بل نقرأ JSON فعليًا ونحسب المصفوفات.
      # =========================================================

      - name: Verify V8 source contents and data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 SOURCE CONTENTS"
          echo "=============================================="

          # -----------------------------------------------------
          # الملفات الأساسية
          # -----------------------------------------------------

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/v8_seed_manifest.json
          test -f app/src/main/java/com/groupfinance/app/MainActivity.java
          test -f app/build.gradle

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts missing."
            exit 1
          fi

          echo "Required project files: OK"


          # -----------------------------------------------------
          # seedGroup
          # -----------------------------------------------------

          if ! grep -qE 'const[[:space:]]+seedGroup[[:space:]]*=' \
            app/src/main/assets/index.html; then

            echo "ERROR: seedGroup was not found."

            echo ""
            echo "seedGroup occurrences:"
            grep -n "seedGroup" \
              app/src/main/assets/index.html \
              | head -20 || true

            exit 1
          fi

          echo "seedGroup found: OK"


          # -----------------------------------------------------
          # أسماء أعضاء حقيقية
          # -----------------------------------------------------

          grep -q 'وهيب صالح محمد هاشم' \
            app/src/main/assets/index.html

          grep -q 'محمد عبده الدائم احمد' \
            app/src/main/assets/index.html

          grep -q 'نواس محمد سعيد غالب سعيد' \
            app/src/main/assets/index.html

          grep -q 'عفان محمد سالم سعيد' \
            app/src/main/assets/index.html

          echo "Required member data found: OK"


          # -----------------------------------------------------
          # الاجتماعات الخمسة
          # -----------------------------------------------------

          grep -q '2024-10-08' \
            app/src/main/assets/index.html

          grep -q '2024-11-08' \
            app/src/main/assets/index.html

          grep -q '2024-12-08' \
            app/src/main/assets/index.html

          grep -q '2025-01-08' \
            app/src/main/assets/index.html

          grep -q '2025-02-08' \
            app/src/main/assets/index.html

          echo "Five required meeting dates found: OK"


          # -----------------------------------------------------
          # قراءة manifest الحقيقي
          #
          # هنا الإصلاح الأساسي.
          # لا نبحث عن "members":30
          # ولا "meetings":5
          # لأنهما Arrays.
          # -----------------------------------------------------

          python3 -c "import json; d=json.load(open('app/src/main/assets/v8_seed_manifest.json', encoding='utf-8')); assert len(d['members']) == 30, 'members count is not 30'; assert len(d['meetings']) == 5, 'meetings count is not 5'; assert all(len(m['rows']) == 30 for m in d['meetings']), 'one meeting does not have 30 rows'; print('Manifest verification: 30 members, 5 meetings, 30 rows per meeting: OK')"


          # -----------------------------------------------------
          # التحقق من التواريخ من JSON نفسه
          # -----------------------------------------------------

          python3 -c "import json; d=json.load(open('app/src/main/assets/v8_seed_manifest.json', encoding='utf-8')); expected=['2024-10-08','2024-11-08','2024-12-08','2025-01-08','2025-02-08']; actual=[m['date'] for m in d['meetings']]; assert actual == expected, f'Unexpected meeting dates: {actual}'; print('Manifest meeting dates: OK')"


          # -----------------------------------------------------
          # التحقق من وجود بيانات مالية فعلية
          # -----------------------------------------------------

          grep -q '165000' \
            app/src/main/assets/index.html

          grep -q '205000' \
            app/src/main/assets/index.html

          grep -q '265000' \
            app/src/main/assets/index.html

          grep -q '242500' \
            app/src/main/assets/index.html

          grep -q '246000' \
            app/src/main/assets/index.html

          echo "Non-zero meeting data found: OK"


          # -----------------------------------------------------
          # orientation fix
          # -----------------------------------------------------

          grep -q 'onConfigurationChanged' \
            app/src/main/java/com/groupfinance/app/MainActivity.java

          grep -q 'configChanges' \
            app/src/main/AndroidManifest.xml

          echo "Orientation handling found: OK"


          # -----------------------------------------------------
          # الطوارئ قبل التشغيله
          # -----------------------------------------------------

          grep -q 'الطوارئ' \
            app/src/main/assets/index.html

          grep -q 'التشغيله' \
            app/src/main/assets/index.html

          echo "Emergency/operation labels found: OK"


          echo ""
          echo "=============================================="
          echo "V8 SOURCE VERIFICATION PASSED"
          echo "=============================================="


      # =========================================================
      # 7 - تجهيز مفتاح توقيع V8
      # =========================================================

      - name: Prepare fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PREPARING FIXED V8 SIGNING KEY"
          echo "=============================================="

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty."
            exit 1
          fi

          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is empty."
            exit 1
          fi


          # -----------------------------------------------------
          # المفتاح داخل app لأن build.gradle يستخدم:
          # file(signingProps['storeFile'])
          # -----------------------------------------------------

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > app/fixed-v8-release.jks

          if [ ! -s app/fixed-v8-release.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created: OK"


          # -----------------------------------------------------
          # إنشاء signing.properties بدون heredoc
          # -----------------------------------------------------

          printf '%s\n' \
            "storeFile=fixed-v8-release.jks" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > signing.properties

          echo "signing.properties created: OK"


          # -----------------------------------------------------
          # اختبار المفتاح
          # -----------------------------------------------------

          keytool -list \
            -keystore app/fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/tmp/v8_key_check.txt

          echo "Fixed V8 signing key verified: OK"


      # =========================================================
      # 8 - بناء APK
      # =========================================================

      - name: Build signed V8 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING GROUPFINANCE V8"
          echo "=============================================="

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK CREATED:"
          ls -lh "$APK"


      # =========================================================
      # 9 - فحص البيانات داخل APK نفسه
      # =========================================================

      - name: Verify APK contains V8 data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING DATA INSIDE APK"
          echo "=============================================="

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          rm -rf /tmp/v8_apk_check
          mkdir -p /tmp/v8_apk_check

          unzip -q "$APK" -d /tmp/v8_apk_check

          APK_INDEX="/tmp/v8_apk_check/assets/index.html"
          APK_MANIFEST="/tmp/v8_apk_check/assets/v8_seed_manifest.json"

          test -f "$APK_INDEX"
          test -f "$APK_MANIFEST"

          echo "APK assets found: OK"


          # -----------------------------------------------------
          # التحقق من التواريخ داخل APK
          # -----------------------------------------------------

          grep -q '2024-10-08' "$APK_INDEX"
          grep -q '2024-11-08' "$APK_INDEX"
          grep -q '2024-12-08' "$APK_INDEX"
          grep -q '2025-01-08' "$APK_INDEX"
          grep -q '2025-02-08' "$APK_INDEX"

          echo "Five meeting dates inside APK: OK"


          # -----------------------------------------------------
          # أسماء أعضاء
          # -----------------------------------------------------

          grep -q 'وهيب صالح محمد هاشم' "$APK_INDEX"
          grep -q 'نواس محمد سعيد غالب سعيد' "$APK_INDEX"
          grep -q 'عفان محمد سالم سعيد' "$APK_INDEX"

          echo "Member data inside APK: OK"


          # -----------------------------------------------------
          # القيم المالية
          # -----------------------------------------------------

          grep -q '165000' "$APK_INDEX"
          grep -q '205000' "$APK_INDEX"
          grep -q '265000' "$APK_INDEX"
          grep -q '242500' "$APK_INDEX"
          grep -q '246000' "$APK_INDEX"

          echo "Non-zero meeting values inside APK: OK"


          # -----------------------------------------------------
          # قراءة manifest داخل APK
          # -----------------------------------------------------

          python3 -c "import json; d=json.load(open('$APK_MANIFEST', encoding='utf-8')); assert len(d['members']) == 30; assert len(d['meetings']) == 5; assert all(len(m['rows']) == 30 for m in d['meetings']); print('APK manifest: 30 members, 5 meetings, 30 rows each: OK')"


          echo ""
          echo "=============================================="
          echo "APK DATA VERIFICATION PASSED"
          echo "=============================================="


      # =========================================================
      # 10 - التحقق من توقيع APK
      # =========================================================

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          EXPECTED_SHA256: ${{ env.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=""

          if [ -n "${ANDROID_HOME:-}" ]; then
            APKSIGNER="$(
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name apksigner \
                -print \
                | sort -V \
                | tail -n 1 || true
            )"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"


          # -----------------------------------------------------
          # التحقق من صلاحية التوقيع
          # -----------------------------------------------------

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"


          # -----------------------------------------------------
          # استخراج SHA-256
          # -----------------------------------------------------

          CERT_OUTPUT="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK"
          )"

          echo ""
          echo "$CERT_OUTPUT"


          ACTUAL_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" \
              | grep -i 'Signer #1 certificate SHA-256 digest' \
              | sed 's/.*: //' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"


          EXPECTED_NORMALIZED="$(
            printf '%s' "$EXPECTED_SHA256" \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d '[:space:]'
          )"


          if [ -z "$ACTUAL_SHA256" ]; then
            echo "ERROR: Could not read APK SHA-256."
            exit 1
          fi


          echo ""
          echo "EXPECTED V8 SHA-256:"
          echo "$EXPECTED_NORMALIZED"

          echo ""
          echo "ACTUAL APK SHA-256:"
          echo "$ACTUAL_SHA256"


          if [ "$ACTUAL_SHA256" != "$EXPECTED_NORMALIZED" ]; then
            echo ""
            echo "ERROR: SIGNATURE DOES NOT MATCH V8 FIXED KEY."
            exit 1
          fi


          echo ""
          echo "=============================================="
          echo "FIXED V8 SIGNATURE VERIFIED"
          echo "=============================================="


      # =========================================================
      # 11 - فحص نهائي للشهادة
      # =========================================================

      - name: Final certificate check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=============================================="
          echo "FINAL CERTIFICATE CHECK"
          echo "=============================================="

          keytool -printcert \
            -jarfile "$APK"

          echo ""
          echo "Certificate check completed."


      # =========================================================
      # 12 - رفع APK
      # =========================================================

      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 13 - نجاح البناء
      # =========================================================

      - name: Build summary
        shell: bash
        run: |
          echo "=============================================="
          echo "GROUPFINANCE V8 BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "30 MEMBERS: VERIFIED"
          echo "5 MEETINGS: VERIFIED"
          echo "30 ROWS PER MEETING: VERIFIED"
          echo "MEETING DATA: VERIFIED"
          echo "ORIENTATION FIX: VERIFIED"
          echo "EMERGENCY BEFORE OPERATION: VERIFIED"
          echo "APK DATA: VERIFIED"
          echo "V8 SIGNATURE: VERIFIED"
          echo ""
          echo "APK IS READY"
          echo "=============================================="
