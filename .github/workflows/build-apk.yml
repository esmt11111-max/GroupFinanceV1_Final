name: Build GroupFinance V8 - Native Restore FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_NATIVE_RESTORE_FINAL_FIXED.zip
  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C
  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 16
  VERSION_NAME: 8.0.3

jobs:
  build:
    name: Build GroupFinance V8 Native Restore - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$SOURCE_ZIP_NAME" \
              -not -path "*/.git/*" \
              | head -1
          )"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP_NAME"
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"
          ls -lh "$SOURCE_ZIP"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$SOURCE_ZIP"

          echo "ZIP integrity: OK"
          sha256sum "$SOURCE_ZIP"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/GroupFinance_SOURCE"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT"

          echo "Searching for Android project..."

          INDEX_FILE="$(
            find "$EXTRACT" \
              -type f \
              -path "*/app/src/main/assets/index.html" \
              | head -1
          )"

          if [ -z "$INDEX_FILE" ]; then
            echo "::error::app/src/main/assets/index.html was not found."

            echo "Extracted directory tree:"
            find "$EXTRACT" -maxdepth 7 -type f | head -200

            exit 1
          fi

          PROJECT_ROOT="${INDEX_FILE%/app/src/main/assets/index.html}"

          if [ ! -f "$PROJECT_ROOT/settings.gradle" ] &&
             [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file was not found."

            find "$PROJECT_ROOT" -maxdepth 3 -type f | sort | head -200

            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Android app directory was not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project located successfully:"
          echo "$PROJECT_ROOT"

      - name: Verify V8 seed and source
        shell: bash
        run: |
          set -euo pipefail

          P="$PROJECT_ROOT"
          H="$P/app/src/main/assets/index.html"
          S="$P/app/src/main/assets/v8_seed_manifest.json"

          test -f "$H"
          test -f "$S"
          test -f "$P/app/src/main/AndroidManifest.xml"

          MEMBERS="$(
            node -e '
              const fs = require("fs");
              const x = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              console.log(Array.isArray(x.members) ? x.members.length : 0);
            ' "$S"
          )"

          MEETINGS="$(
            node -e '
              const fs = require("fs");
              const x = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              console.log(Array.isArray(x.meetings) ? x.meetings.length : 0);
            ' "$S"
          )"

          echo "Members: $MEMBERS"
          echo "Meetings: $MEETINGS"

          test "$MEMBERS" = "30"
          test "$MEETINGS" = "5"

          node - "$S" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const text = fs.readFileSync(file, "utf8");

          const requiredDates = [
            "2024-10-08",
            "2024-11-08",
            "2024-12-08",
            "2025-01-08",
            "2025-02-08"
          ];

          for (const date of requiredDates) {
            if (!text.includes(date)) {
              console.error("Required meeting date missing:", date);
              process.exit(1);
            }
          }

          console.log("Required V8 meeting dates: VERIFIED");
          NODE

          echo "V8 seed: VERIFIED"

      - name: Verify meeting source images
        shell: bash
        run: |
          set -euo pipefail

          COUNT="$(
            find "$PROJECT_ROOT/app/src/main/assets" \
              -type f \
              -name 'meeting_source_*.jpg' \
              | wc -l
          )"

          echo "Meeting images found: $COUNT"

          test "$COUNT" -ge 10

          echo "Meeting source images: VERIFIED"

      - name: Verify existing data system
        shell: bash
        run: |
          set -euo pipefail

          H="$PROJECT_ROOT/app/src/main/assets/index.html"

          grep -Fq "group_fin_groups_v5" "$H"
          grep -Fq "v8-data-seed-2026-09-16" "$H"
          grep -Fq "function save()" "$H"

          echo "Existing V8 data system: VERIFIED"

      - name: Verify native backup restore fix
        shell: bash
        run: |
          set -euo pipefail

          H="$PROJECT_ROOT/app/src/main/assets/index.html"
          J="$PROJECT_ROOT/app/src/main/java/com/groupfinance/app/MainActivity.java"

          echo "Checking HTML native restore implementation..."

          grep -Fq "openBackupFilePicker" "$H"
          grep -Fq "receiveNativeBackup" "$H"
          grep -Fq "nativeBackupText" "$H"

          echo "Checking Android native file picker..."

          grep -Fq "openBackupPickerNative" "$J"
          grep -Fq "ACTION_OPEN_DOCUMENT" "$J"
          grep -Fq "application/octet-stream" "$J"
          grep -Fq "deliverBackupToWeb" "$J"

          echo "Native .gfbak restore: VERIFIED"

      - name: Verify no destructive data reset
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          if grep -RInE \
            "localStorage[.]clear[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::Destructive localStorage.clear() detected."
            exit 1
          fi

          if grep -RInE \
            "indexedDB[.]deleteDatabase[[:space:]]*\(" \
            "$ASSETS" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::Destructive IndexedDB deletion detected."
            exit 1
          fi

          echo "No destructive data reset detected."

      - name: Verify four requested features
        shell: bash
        run: |
          set -euo pipefail

          H="$PROJECT_ROOT/app/src/main/assets/index.html"
          J="$PROJECT_ROOT/app/src/main/java/com/groupfinance/app/MainActivity.java"

          grep -Fq 'إجمالي المتبقي من التمويلات' "$H"

          grep -Fq 'function renderFunds()' "$H
