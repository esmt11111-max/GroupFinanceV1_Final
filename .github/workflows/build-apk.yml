name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. تحميل المستودع
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. البحث عن ملف V8 الصحيح وفك الضغط
      # =========================================================
      - name: Verify and extract exact V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo "=============================================="
          echo "GROUPFINANCE V8 SOURCE CHECK"
          echo "=============================================="

          echo "Required source:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: V8 source ZIP was NOT found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n" | sort
            exit 1
          fi

          echo ""
          echo "SUCCESS: Correct V8 source ZIP found."

          echo ""
          echo "ZIP size:"
          ls -lh "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit \
              | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside ZIP."
            exit 1
          fi

          echo ""
          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 3. فحص بيانات V8 قبل البناء
      # =========================================================
      - name: Verify V8 source contents and data
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFYING V8 SOURCE CONTENTS"
          echo "=============================================="

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/v8_seed_manifest.json
          test -f app/src/main/java/com/groupfinance/app/MainActivity.java
          test -f app/build.gradle
          test -f settings.gradle

          echo "Required project files: OK"

          python3 <<'PY'
          import json
          import sys

          index_file = "app/src/main/assets/index.html"

          with open(index_file, "r", encoding="utf-8") as f:
              html = f.read()

          marker = "const seedGroup ="

          start = html.find(marker)

          if start == -1:
              print("ERROR: const seedGroup was not found.")
              sys.exit(1)

          json_start = html.find("{", start)

          if json_start == -1:
              print("ERROR: seedGroup JSON start was not found.")
              sys.exit(1)

          decoder = json.JSONDecoder()

          try:
              seed, end_pos = decoder.raw_decode(html[json_start:])
          except Exception as e:
              print("ERROR: seedGroup JSON could not be parsed.")
              print(e)
              sys.exit(1)

          members = seed.get("members", [])
          meetings = seed.get("meetings", [])

          print("")
          print("Members:", len(members))
          print("Meetings:", len(meetings))

          # -----------------------------------------------------
          # يجب أن يكون لدينا 30 عضوًا
          # -----------------------------------------------------
          if len(members) != 30:
              print("ERROR: Expected exactly 30 members.")
              sys.exit(1)

          # -----------------------------------------------------
          # يجب أن يكون لدينا 5 اجتماعات
          # -----------------------------------------------------
          if len(meetings) != 5:
              print("ERROR: Expected exactly 5 meetings.")
              sys.exit(1)

          expected_dates = [
              "2024-10-08",
              "2024-11-08",
              "2024-12-08",
              "2025-01-08",
              "2025-02-08"
          ]

          actual_dates = [
              meeting.get("date")
              for meeting in meetings
          ]

          print("")
          print("Meeting dates:")
          for date in actual_dates:
              print(" -", date)

          if actual_dates != expected_dates:
              print("")
              print("ERROR: Meeting dates do not match.")
              print("Expected:", expected_dates)
              print("Actual:", actual_dates)
              sys.exit(1)

          # -----------------------------------------------------
          # كل اجتماع يجب أن يحتوي على 30 عضوًا
          # -----------------------------------------------------
          for meeting in meetings:
              rows = meeting.get("rows", [])

              print(
                  meeting.get("date"),
                  "rows =",
                  len(rows)
              )

              if len(rows) != 30:
                  print(
                      "ERROR: Meeting",
                      meeting.get("date"),
                      "does not contain 30 rows."
                  )
                  sys.exit(1)

          # -----------------------------------------------------
          # التأكد أن البيانات المالية ليست كلها أصفار
          # -----------------------------------------------------
          non_zero = 0

          possible_keys = [
              "savings",
              "operation",
              "emergency",
              "installment",
              "paidInstallment",
              "totalPaid"
          ]

          for meeting in meetings:
              for row in meeting.get("rows", []):
                  for key in possible_keys:
                      value = row.get(key, 0)

                      try:
                          if float(value or 0) != 0:
                              non_zero += 1
                      except Exception:
                          pass

          print("")
          print("Non-zero financial values:", non_zero)

          if non_zero == 0:
              print(
                  "ERROR: Meeting financial data appears to be empty."
              )
              sys.exit(1)

          # -----------------------------------------------------
          # التأكد من وجود أسماء الحقول المطلوبة
          # -----------------------------------------------------
          if "الطوارئ" not in html:
              print("ERROR: الطوارئ label not found.")
              sys.exit(1)

          if "التشغيله" not in html:
              print("ERROR: التشغيله label not found.")
              sys.exit(1)

          # -----------------------------------------------------
          # التأكد من وجود معالجة تغيير اتجاه الشاشة
          # -----------------------------------------------------
          with open(
              "app/src/main/java/com/groupfinance/app/MainActivity.java",
              "r",
              encoding="utf-8"
          ) as f:
              main_activity = f.read()

          if "onConfigurationChanged" not in main_activity:
              print(
                  "ERROR: onConfigurationChanged was not found."
              )
              sys.exit(1)

          print("")
          print("==============================================")
          print("V8 SOURCE VERIFICATION PASSED")
          print("==============================================")
          print("30 members: OK")
          print("5 meetings: OK")
          print("30 rows per meeting: OK")
          print("Non-zero financial data: OK")
          print("Orientation handling: OK")
          print("==============================================")


      # =========================================================
      # 4. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 5. Gradle 8.9
      # =========================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # =========================================================
      # 6. تجهيز مفتاح توقيع V8 الثابت
      # =========================================================
      - name: Configure fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "CONFIGURING V8 SIGNING KEY"
          echo "=============================================="

          # -----------------------------------------------------
          # التأكد من وجود Secrets الأربعة
          # -----------------------------------------------------
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "All signing secrets are available."

          # -----------------------------------------------------
          # إنشاء مجلد app إذا لزم
          # -----------------------------------------------------
          mkdir -p app

          # -----------------------------------------------------
          # IMPORTANT:
          # Gradle يبحث عن:
          #
          # app/fixed-v8-release.jks
          #
          # لذلك المفتاح يوضع داخل app وليس في جذر المشروع.
          # -----------------------------------------------------
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/fixed-v8-release.jks

          # -----------------------------------------------------
          # التأكد أن الملف موجود وغير فارغ
          # -----------------------------------------------------
          if [ ! -s app/fixed-v8-release.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created successfully."

          echo ""
          echo "Keystore location:"
          echo "app/fixed-v8-release.jks"

          echo ""
          echo "Keystore size:"
          ls -lh app/fixed-v8-release.jks

          # -----------------------------------------------------
          # إنشاء signing.properties
          #
          # storeFile is intentionally only the filename because
          # the signing configuration resolves it inside app/.
          # -----------------------------------------------------
          cat > signing.properties <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          echo ""
          echo "signing.properties created."

          # -----------------------------------------------------
          # فحص المفتاح قبل بدء Gradle
          # -----------------------------------------------------
          echo ""
          echo "Checking keystore before Gradle build..."

          keytool \
            -list \
            -keystore app/fixed-v8-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /tmp/v8_keystore_check.txt

          echo "Keystore check PASSED."

          echo "=============================================="
          echo "V8 SIGNING KEY READY"
          echo "=============================================="


      # =========================================================
      # 7. بناء APK
      # =========================================================
      - name: Build signed V8 release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING GROUPFINANCE V8"
          echo "=============================================="

          # فحص نهائي قبل Gradle
          if [ ! -f app/fixed-v8-release.jks ]; then
            echo "ERROR: Keystore missing before build."
            exit 1
          fi

          echo "Keystore exists:"
          ls -lh app/fixed-v8-release.jks

          echo ""
          echo "Starting Gradle..."

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

          # -----------------------------------------------------
          # التأكد من إنشاء APK
          # -----------------------------------------------------
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=============================================="

          echo "APK:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"


      # =========================================================
      # 8. التحقق من توقيع APK
      # =========================================================
      - name: Verify APK signature and V8 fingerprint
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          echo ""
          echo "Running apksigner verification..."

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK certificate:"

          keytool -printcert -jarfile "$APK"

          # -----------------------------------------------------
          # البصمة الثابتة لمفتاح V8
          # -----------------------------------------------------
          EXPECTED_SHA256="14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          echo ""
          echo "Checking fixed V8 SHA-256 fingerprint..."

          keytool -printcert -jarfile "$APK" \
            | grep -F "$EXPECTED_SHA256"

          echo ""
          echo "=============================================="
          echo "V8 SIGNATURE VERIFIED"
          echo "=============================================="
          echo "Fixed V8 fingerprint matches."
          echo "=============================================="


      # =========================================================
      # 9. رفع APK كـ Artifact
      # =========================================================
      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 10. ملخص البناء
      # =========================================================
      - name: Build summary
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "GROUPFINANCE V8 BUILD COMPLETED"
          echo "=============================================="

          echo "Source ZIP:"
          echo "GroupFinanceV8_30MEMBERS_ORIENTATION_ORDER_FIXED.zip"

          echo ""
          echo "APK:"
          echo "app/build/outputs/apk/release/app-release.apk"

          echo ""
          echo "Artifact:"
          echo "GroupFinance-V8-release-signed"

          echo ""
          echo "Signing:"
          echo "Fixed V8 signing key"

          echo ""
          echo "Expected SHA-256:"
          echo "14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C"

          echo ""
          echo "=============================================="
