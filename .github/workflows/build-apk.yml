name: Build GroupFinance V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE, extracting..."
            unzip -q "$ZIP_FILE" -d unzipped_project
          else
            echo "No zip file found in root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Perfect WebView MainActivity
        shell: bash
        run: |
          set -e
          echo "Writing a robust and clean MainActivity.java for local HTML assets..."
          
          # العثور على مسار ملف MainActivity.java الحقيقي في المشروع
          MAIN_JAVA=$(find . -name "MainActivity.java" | head -n 1)
          
          if [ -n "$MAIN_JAVA" ]; then
            JAVA_DIR=$(dirname "$MAIN_JAVA")
            PACKAGE_LINE=$(grep -m 1 "^package " "$MAIN_JAVA" || echo "package com.groupfinance.app;")
            
            echo "Target Java file found at: $MAIN_JAVA"
            echo "Using package: $PACKAGE_LINE"
            
            # إعادة كتابة MainActivity بكود WebView مثالي وداعم للجافاسكريبت محلياً
            cat << EOF > "$MAIN_JAVA"
$PACKAGE_LINE

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        
        webView = new WebView(this);
        setContentView(webView);

        WebSettings webSettings = webView.getSettings();
        webSettings.setJavaScriptEnabled(true);
        webSettings.setDomStorageEnabled(true);
        webSettings.setAllowFileAccess(true);
        webSettings.setAllowContentAccess(true);

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, String url) {
                view.loadUrl(url);
                return true;
            }
        });

        // تحميل الصفحة الرئيسية المحلية من مجلد الأصول (assets)
        webView.loadUrl("file:///android_asset/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF
            echo "MainActivity successfully replaced with a clean working version."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd unzipped_project
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V6-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 30
