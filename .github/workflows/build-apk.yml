name: Build GroupFinance V8 FINAL READY

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-v8:
    name: Build V8 from FINAL FIXED V2 ZIP
    runs-on: ubuntu-latest

    env:
      PROJECT_ZIP: .github/workflows/GroupFinanceV8_FINAL_READY_TO_BUILD_FIXED_V2.zip
      EXPECTED_SOURCE_SHA256: 50602a114c82971351a81dfbb5aa3ce057e0c369a6bf21ec2e9d8aff0e34f9e9
      EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$PROJECT_ZIP"
            echo ""
            echo "Available files:"
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          echo "Source ZIP found:"
          echo "$PROJECT_ZIP"

          unzip -tq "$PROJECT_ZIP"

          ACTUAL_SOURCE_SHA256="$(sha256sum "$PROJECT_ZIP" | awk '{print $1}')"

          echo "Expected SHA-256:"
          echo "$EXPECTED_SOURCE_SHA256"

          echo "Actual SHA-256:"
          echo "$ACTUAL_SOURCE_SHA256"

          if [ "$ACTUAL_SOURCE_SHA256" != "$EXPECTED_SOURCE_SHA256" ]; then
            echo "ERROR: Source ZIP SHA-256 mismatch."
            exit 1
          fi

          echo "Source ZIP: VERIFIED"

      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/GroupFinanceV8_FINAL_READY"

          rm -rf "$P"
          mkdir -p "$P"

          unzip -q "$PROJECT_ZIP" -d "$P"

          echo "Project extracted to:"
          echo "$P"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/GroupFinanceV8_FINAL_READY"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/assets/index.html"
            "app/src/main/assets/v8_seed_manifest.json"
            "app/src/main/java/com/groupfinance/app/MainActivity.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$P/$FILE" ]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo "Android project structure: VERIFIED"

      - name: Verify V8 seed data
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/GroupFinanceV8_FINAL_READY"
          M="$P/app/src/main/assets/v8_seed_manifest.json"

          if [ ! -f "$M" ]; then
            echo "ERROR: Seed manifest not found:"
            echo "$M"
            exit 1
          fi

          jq -e '
            (.members | type == "array")
            and
            (.meetings | type == "array")
          ' "$M" >/dev/null

          MEMBERS="$(jq '.members | length' "$M")"
          MEETINGS="$(jq '.meetings | length' "$M")"

          echo "Members: $MEMBERS"
          echo "Meetings: $MEETINGS"

          if [ "$MEMBERS" -ne 30 ]; then
            echo "ERROR: Expected exactly 30 members."
            echo "Found: $MEMBERS"
            exit 1
          fi

          if [ "$MEETINGS" -ne 5 ]; then
            echo "ERROR: Expected exactly 5 meetings."
            echo "Found: $MEETINGS"
            exit 1
          fi

          EXPECTED_DATES='["2024-10-08","2024-11-08","2024-12-08","2025-01-08","2025-02-08"]'

          ACTUAL_DATES="$(jq -c '[.meetings[].date]' "$M")"

          echo "Expected dates:"
          echo "$EXPECTED_DATES"

          echo "Actual dates:"
          echo "$ACTUAL_DATES"

          if [ "$ACTUAL_DATES" != "$EXPECTED_DATES" ]; then
            echo "ERROR: Meeting dates mismatch."
            exit 1
          fi

          echo "V8 seed data: VERIFIED"

      - name: Verify V8 UI and features
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/
