name: Build GroupFinance V8 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract exact V8 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./GroupFinanceV8_30MEMBERS_FINAL_DATA_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required V8 source ZIP not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "=========================================="
          echo "USING EXACT V8 SOURCE:"
          echo "GroupFinanceV8_30MEMBERS_FINAL_DATA_FIX.zip"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify V8 source contents
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required V8 files..."

          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/v8_seed_manifest.json
          test -f app/src/main/java/com/groupfinance/app/MainActivity.java

          echo "Checking member data..."

          grep -q "وهيب صالح محمد هاشم" app/src/main/assets/index.html
          grep -q "محمد عبده الدائم احمد" app/src/main/assets/index.html
          grep -q "رمزي محمد عبد الباقي سعيد" app/src/main/assets/index.html
          grep -q "عفان محمد سالم سعيد" app/src/main/assets/index.html

          echo "Checking five meeting dates..."

          grep -q "2024-10-08" app/src/main/assets/index.html
          grep -q "2024-11-08" app/src/main/assets/index.html
          grep -q "2024-12-08" app/src/main/assets/index.html
          grep -q "2025-01-08" app/src/main/assets/index.html
          grep -q "2025-02-08" app/src/main/assets/index.html

          echo "V8 source data checks passed successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure fixed V8 signing key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "Preparing fixed V8 signing key..."

          mkdir -p app

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/fixed-v8-release.jks

          cat > signing.properties <<EOF
          storeFile=fixed-v8-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 app/fixed-v8-release.jks
          chmod 600 signing.properties

          echo "Signing files prepared."

          echo "Checking keystore location:"
          test -f app/fixed-v8-release.jks

          echo "Keystore exists successfully."

      - name: Build signed V8 release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting V8 release build..."

          test -f app/fixed-v8-release.jks
          test -f signing.properties

          gradle :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK exists and signature
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verification passed."

          keytool -printcert -jarfile "$APK" \
            | grep -E "Owner:|SHA256:"

      - name: Upload signed V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupFinance-V8-release-signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
