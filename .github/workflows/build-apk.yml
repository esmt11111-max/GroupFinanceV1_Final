name: Build GroupFinance V8 - 4 Features FINAL UPDATE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SOURCE_ZIP_NAME: GroupFinanceV8_UPDATE_4_FEATURES_FINAL_FIXED.zip

  EXPECTED_CERT_SHA256: 14:E8:EA:A0:00:0E:8E:CF:9B:CE:54:8E:31:7D:38:C3:BB:50:76:00:3C:8C:5D:5A:5B:44:B5:86:EB:0E:C5:6C

  APPLICATION_ID: com.groupfinance.app
  VERSION_CODE: 15
  VERSION_NAME: 8.0.2

jobs:
  build:
    name: Build GroupFinance V8 Update - Preserve Existing Data
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Download repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Locate the exact source ZIP
      # ---------------------------------------------------------
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching repository for:"
          echo "$SOURCE_ZIP_NAME"

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$SOURCE_ZIP_NAME" \
              -not -path "*/.git/*"
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::Source ZIP was not found: $SOURCE_ZIP_NAME"
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::More than one source ZIP was found."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          SOURCE_ZIP="${ZIP_FILES[0]}"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

          echo "Found source ZIP:"
          echo "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      # ---------------------------------------------------------
      # 3. Validate ZIP before extraction
      # ---------------------------------------------------------
      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing ZIP integrity..."

          unzip -tq "$SOURCE_ZIP"

          echo "ZIP integrity OK."

      # ---------------------------------------------------------
      # 4. Extract source project
      # ---------------------------------------------------------
      - name: Extract source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/groupfinance_source"
          mkdir -p "$RUNNER_TEMP/groupfinance_source"

          unzip -q "$SOURCE_ZIP" \
            -d "$RUNNER_TEMP/groupfinance_source"

          echo "Extracted source tree:"
          find "$RUNNER_TEMP/groupfinance_source" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

          PROJECT_ROOT=""

          if [ -f "$RUNNER_TEMP/groupfinance_source/settings.gradle" ] || \
             [ -f "$RUNNER_TEMP/groupfinance_source/settings.gradle.kts" ]; then

            PROJECT_ROOT="$RUNNER_TEMP/groupfinance_source"

          else

            while IFS= read -r SETTINGS_FILE; do
              CANDIDATE="$(dirname "$SETTINGS_FILE")"

              if [ -f "$CANDIDATE/settings.gradle" ] || \
                 [ -f "$CANDIDATE/settings.gradle.kts" ]; then

                PROJECT_ROOT="$CANDIDATE"
                break
              fi

            done < <(
              find "$RUNNER_TEMP/groupfinance_source" \
                -type f \
                -name "settings.gradle" -o -name "settings.gradle.kts" \
                -print
            )

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project root was not found."
            find "$RUNNER_TEMP/groupfinance_source" \
              -maxdepth 6 \
              -type f \
              | sort
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project root:"
          echo "$PROJECT_ROOT"

      # ---------------------------------------------------------
      # 5. Verify Android project identity
      # ---------------------------------------------------------
      - name: Verify Android project identity
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle"
          APP_GRADLE_KTS="$PROJECT_ROOT/app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then
            APP_FILE="$APP_GRADLE"
          elif [ -f "$APP_GRADLE_KTS" ]; then
            APP_FILE="$APP_GRADLE_KTS"
          else
            echo "::error::app/build.gradle or app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APP_FILE"

          echo "Checking application ID..."

          if ! grep -Eq \
            "applicationId[[:space:]]*[=(]?[[:space:]]*['\"]${APPLICATION_ID}['\"]" \
            "$APP_FILE"; then

            echo "::error::Application ID is not $APPLICATION_ID"
            grep -n "applicationId" "$APP_FILE" || true
            exit 1
          fi

          echo "Application ID OK:"
          echo "$APPLICATION_ID"

          echo "Checking version..."

          CURRENT_VERSION_CODE="$(
            grep -Eo \
              "versionCode[[:space:]]+[0-9]+" \
              "$APP_FILE" \
              | head -1 \
              | grep -Eo "[0-9]+" \
              || true
          )"

          if [ -n "$CURRENT_VERSION_CODE" ]; then
            echo "Source versionCode: $CURRENT_VERSION_CODE"
            echo "Target versionCode: $VERSION_CODE"

            if [ "$CURRENT_VERSION_CODE" -ge "$VERSION_CODE" ]; then
              echo "::error::Target versionCode must be higher than the source versionCode."
              exit 1
            fi
          fi

          echo "Android project identity OK."

      # ---------------------------------------------------------
      # 6. Verify data preservation markers
      # ---------------------------------------------------------
      - name: Verify data preservation markers
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source for the existing data system..."

          HTML_FILES=()

          while IFS= read -r FILE; do
            HTML_FILES+=("$FILE")
          done < <(
            find "$PROJECT_ROOT/app/src/main/assets" \
              -type f \
              -name "*.html" -o -name "*.js" \
              -print 2>/dev/null
          )

          if [ "${#HTML_FILES[@]}" -eq 0 ]; then
            echo "::error::No HTML/JavaScript application files were found in assets."
            exit 1
          fi

          FOUND_GROUP_KEY=0
          FOUND_SAVE=0
          FOUND_SEED=0

          for FILE in "${HTML_FILES[@]}"; do

            if grep -Fq "group_fin_groups_v5" "$FILE"; then
              FOUND_GROUP_KEY=1
            fi

            if grep -Fq "function save()" "$FILE"; then
              FOUND_SAVE=1
            fi

            if grep -Fq "v8-data-seed-2026-09-16" "$FILE"; then
              FOUND_SEED=1
            fi

          done

          if [ "$FOUND_GROUP_KEY" -ne 1 ]; then
            echo "::error::Existing storage key group_fin_groups_v5 was not found."
            exit 1
          fi

          if [ "$FOUND_SAVE" -ne 1 ]; then
            echo "::error::Existing save() function was not found."
            exit 1
          fi

          if [ "$FOUND_SEED" -ne 1 ]; then
            echo "::error::Existing V8 data seed marker was not found."
            exit 1
          fi

          echo "Checking for destructive data reset commands..."

          if grep -RInE \
            "localStorage[.]clear[[:space:]]*\(" \
            "$PROJECT_ROOT/app/src/main/assets" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::localStorage.clear() was found. This could erase existing data."
            exit 1
          fi

          if grep -RInE \
            "indexedDB[.]deleteDatabase[[:space:]]*\(" \
            "$PROJECT_ROOT/app/src/main/assets" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::indexedDB.deleteDatabase() was found."
            exit 1
          fi

          if grep -RInE \
            "clearData[[:space:]]*\(" \
            "$PROJECT_ROOT/app/src/main/assets" \
            --include="*.html" \
            --include="*.js"; then

            echo "::error::clearData() was found."
            exit 1
          fi

          echo "Data preservation markers OK."

      # ---------------------------------------------------------
      # 7. Verify the four requested features
      # ---------------------------------------------------------
      - name: Verify four requested features
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="$PROJECT_ROOT/app/src/main/assets"

          echo "Checking requested V8 features..."

          REQUIRED_TEXTS=(
            "إجمالي المتبقي من التمويلات"
            "إجمالي المدخرات تاريخيًا"
            "إجمالي المصروف منه"
            "الرصيد المتبقي"
          )

          for TEXT in "${REQUIRED_TEXTS[@]}"; do

            if ! grep -RInF \
              "$TEXT" \
              "$ASSETS" \
              --include="*.html" \
              --include="*.js" \
              >/dev/null; then

              echo "::error::Required feature text was not found: $TEXT"
              exit 1
            fi

            echo "Found: $TEXT"

          done

          echo "Checking required function names..."

          REQUIRED_FUNCTIONS=(
            "renderDashboard"
            "renderFunds"
            "renderReports"
            "openMember"
            "memberSavings"
            "loanStats"
            "sumFund"
            "exportData"
            "importData"
            "save"
            "printMemberReport"
            "shareMemberReport"
            "printFinancialReport"
          )

          for FUNCTION_NAME in "${REQUIRED_FUNCTIONS[@]}"; do

            if ! grep -RInE \
              "function[[:space:]]+${FUNCTION_NAME}[[:space:]]*[(]" \
              "$ASSETS" \
              --include="*.html" \
              --include="*.js" \
              >/dev/null; then

              echo "::error::Required function was not found: $FUNCTION_NAME"
              exit 1
